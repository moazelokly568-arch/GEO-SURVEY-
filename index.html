    map.on('mousemove', (e) => { try { const u = G.toUTM(e.latlng.lat, e.latlng.lng); $('#cur').textContent = `${fx(e.latlng.lat, 6)}, ${fx(e.latlng.lng, 6)} | UTM ${u.zone}${u.band} ${fx(u.E, 1)} / ${fx(u.N, 1)}`; } catch (x) { $('#cur').textContent = fx(e.latlng.lat, 6) + ', ' + fx(e.latlng.lng, 6); } });
    map.on('click', (e) => { const p = [e.latlng.lat, e.latlng.lng]; if (mode === 'point') { S.map.features.push({ kind: 'point', name: 'P' + (S.map.features.filter((f) => f.kind === 'point').length + 1), c: [p] }); save(); redraw(); } else { drawing.push(p); tmpRedraw(); } });
    $('#mfin').onclick = finish; $('#mundo').onclick = () => { drawing.pop(); tmpRedraw(); };
    $('#mgps').onclick = () => { if (!navigator.geolocation) return toast('GPS unsupported'); navigator.geolocation.getCurrentPosition((p) => { const ll = [p.coords.latitude, p.coords.longitude]; map.setView(ll, 17); L_.circle(ll, { radius: p.coords.accuracy, color: '#0b7f86' }).addTo(tmp); toast(`GPS ±${Math.round(p.coords.accuracy)} m`); }, (e) => toast(T('تعذر GPS: ', 'GPS failed: ') + e.message), { enableHighAccuracy: true, timeout: 12000 }); };
    $('#mgj').onclick = () => { if (!S.map.features.length) return toast(T('لا توجد عناصر', 'No features')); download('geosurvey_map.geojson', JSON.stringify(toGeoJSON(), null, 1), 'application/geo+json'); };
    $('#mcsv').onclick = () => { const rows = []; S.map.features.forEach((f) => f.c.forEach((p, i) => rows.push([f.name, f.kind, i + 1, p[0], p[1]]))); if (!rows.length) return toast(T('لا توجد عناصر', 'No features')); download('geosurvey_vertices.csv', toCSV(['Feature', 'Kind', 'Vertex', 'Lat', 'Lon'], rows), 'text/csv'); };
    $('#mdxf').onclick = () => { try { const pts = [], ls = []; S.map.features.forEach((f) => { const xy = f.c.map((p) => { const u = G.toUTM(p[0], p[1]); return [u.E, u.N]; }); if (f.kind === 'point') pts.push({ name: f.name, x: xy[0][0], y: xy[0][1], z: 0 }); else ls.push({ pts: xy, closed: f.kind === 'polygon' }); }); if (!pts.length && !ls.length) return toast(T('لا توجد عناصر', 'No features')); download('geosurvey_map_utm.dxf', dxf(pts, ls), 'application/dxf'); toast(T('DXF بإحداثيات UTM WGS84 (نطاق كل عنصر تلقائي)', 'DXF in UTM WGS84 (auto zone per vertex)')); } catch (e) { toast(e.message); } };
    $('#mproj').onclick = () => { const p = activeProject(); if (!p) return toast(T('اختر مشروعًا نشطًا أولًا', 'Pick an active project first')); p.features = (p.features || []).concat(JSON.parse(JSON.stringify(S.map.features))); S.map.features.filter((f) => f.kind === 'point').forEach((f) => { const u = G.toUTM(f.c[0][0], f.c[0][1]); p.points.push({ name: f.name, x: +u.E.toFixed(3), y: +u.N.toFixed(3), z: null }); }); save(); toast(T('تم الحفظ: النقاط أُضيفت كـ UTM WGS84', 'Saved: points added as UTM WGS84')); };
    let cc = false; $('#mclr').onclick = function () { if (!cc) { cc = true; this.textContent = T('تأكيد؟', 'Confirm?'); return; } S.map.features = []; save(); redraw(); cc = false; this.textContent = T('مسح الكل', 'Clear all'); };
    $('#mf').onchange = (e) => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('#mimp').value = String(r.result); }; r.readAsText(f); };
    $('#mi').onclick = () => { try { const t = $('#mimp').value.trim(); if (!t) throw new Error(T('الصق محتوى أو اختر ملفًا', 'Paste content or pick a file')); const fs = t.startsWith('<') ? parseKML(t) : parseGeoJSON(t); const bad = fs.some((f) => f.c.some((p) => !(Math.abs(p[0]) <= 90 && Math.abs(p[1]) <= 180))); if (bad) throw new Error(T('الإحداثيات ليست درجات WGS84 (lon/lat). حوّلها أولًا.', 'Coordinates are not WGS84 lon/lat degrees. Convert first.')); S.map.features.push(...fs); save(); redraw(); const b = L_.latLngBounds(fs.flatMap((f) => f.c)); map.fitBounds(b, { maxZoom: 17 }); msg(`${fs.length} ${T('عنصر مستورد', 'features imported')}`, true); } catch (e) { msg(e.message, false); } };
    redraw(); if (S.map.features.length) { try { map.fitBounds(L_.latLngBounds(S.map.features.flatMap((f) => f.c)), { maxZoom: 17, padding: [20, 20] }); } catch (e) {} }
    setTimeout(() => map && map.invalidateSize(), 200);
  };

  /* ---------- settings / status ---------- */
  const spec = [
    ['1', 'لوحة التحكم|Dashboard', 'ok'], ['2', 'الحسابات المساحية + ضبط الزوايا + المربعات الصغرى لشبكات الميزانية|Survey calcs + angular adjustment + LS leveling networks', 'ok'], ['3', 'الميزانية (PDF عبر الطباعة، CSV)|Leveling (PDF via print, CSV)', 'ok'], ['4', 'Total Station (حساب + توقيع + شرح)|Total Station (compute, stakeout, guide)', 'ok'],
    ['5', 'GNSS (شرح + فحص جودة الجلسات + ارتفاعات؛ بدون معالجة خطوط القاعدة)|GNSS (guide + session QC + heights; no baseline processing)', 'part'], ['6', 'الطرق (محور PI + منحنى أفقي ورأسي + مساحات المقاطع + الحجوم)|Roads (PI alignment, horizontal & vertical curves, section areas, volumes)', 'ok'], ['7', 'الموقع والإنشاءات (توقيع محاور، تعامد، As-Built، حفر، دليل الاستلام للتسليم)|Site works (grid setout, squareness, as-built, excavation, handover guide)', 'ok'],
    ['8', 'Civil 3D (مسار شرح نصي)|Civil 3D (text learning path)', 'part'], ['9', 'AutoCAD (أوامر وشرح)|AutoCAD (commands)', 'part'], ['10', 'GIS (شرح + خريطة + GeoJSON؛ لا تحليل مكاني متقدم)|GIS (guide + map + GeoJSON; no advanced spatial analysis)', 'part'], ['11', 'الاستشعار عن بعد (مؤشرات + شرح؛ لا معالجة صور/GEE)|Remote sensing (indices + guide; no imagery/GEE)', 'part'],
    ['12', 'تحويل الإحداثيات (UTM، Helmert 2D، Helmert 7 بمعاملاتك الرسمية)|Coordinates (UTM, Helmert 2D, Helmert-7 with your official params)', 'ok'], ['13', 'حساب الكميات (مقاطع + شبكة + مساحات)|Quantities (sections, grid, areas)', 'ok'], ['14', 'الخريطة التفاعلية (Leaflet)|Interactive map (Leaflet)', 'ok'],
    ['15', 'التدريب (10 كورسات، 27 درس، اختبارات، نقاط، مصطلحات، فيديوهات يوتيوب)|Training (10 courses, 27 lessons, quizzes, points, glossary, YouTube)', 'ok'], ['16', 'المساعد (قواعد + فحص CSV، بدون LLM)|Assistant (rules + CSV check, no LLM)', 'part'], ['17', 'إدارة المشاريع|Project management', 'ok'],
    ['18', 'استيراد/تصدير (CSV/TXT/GeoJSON/KML/DXF نقاط/Excel .xls/PDF بالطباعة)|Import/export (CSV/TXT/GeoJSON/KML/DXF points/Excel .xls/print-PDF)', 'ok'], ['19', 'التصميم (Dark/Light، RTL، AR/EN، متجاوب)|Design (dark/light, RTL, AR/EN, responsive)', 'ok'], ['20', 'التطوير: كود منظم + اختبارات حسابية|Dev: modular code + math tests', 'ok'],
  ];
  views.settings = () => {
    setTitle(T('الإعدادات وحالة الإنجاز', 'Settings & status'));
    main().innerHTML = `<div class="card"><h3>${T('البيانات', 'Data')}</h3><div class="row"><button class="btn" id="bk">⬇ ${T('نسخة احتياطية JSON', 'Backup JSON')}</button><label class="btn">⬆ ${T('استعادة', 'Restore')}<input type="file" id="rs" accept=".json" style="display:none"></label><button class="btn danger" id="wipe">🗑 ${T('مسح كل البيانات', 'Erase all data')}</button></div><p class="note">${persistent ? T('البيانات محفوظة محليًا على هذا الجهاز فقط ولا تُرسل لأي مكان.', 'Data is stored locally on this device only; nothing is uploaded.') : T('⚠ التخزين الدائم غير متاح في هذا المتصفح/البيئة.', '⚠ Persistent storage unavailable.')}</p></div>
<div class="card"><h3>${T('ما يحتاج إنترنت', 'What needs internet')}</h3><ul><li>${T('صور الخريطة الأساسية (OSM/Esri/OpenTopo)', 'Base map tiles')}</li><li>${T('الطقس (Open-Meteo) بعد ضغطك على الزر', 'Weather (Open-Meteo) after you press the button')}</li><li>${T('كل الحسابات والمشاريع تعمل بدون إنترنت', 'All calculations and projects work offline')}</li></ul></div>
<div class="card"><h3>${T('حالة تنفيذ بنود المواصفات (الإصدار 1)', 'Spec coverage status (v1)')}</h3><div class="tw"><table><tbody>${spec.map(([n, t, s]) => `<tr><td>${n}</td><td style="direction:rtl;text-align:right;white-space:normal">${esc(L(t))}</td><td>${s === 'ok' ? '✔' : '◐'}</td></tr>`).join('')}</tbody></table></div><p class="note">✔ ${T('مكتمل في v1', 'done in v1')} · ◐ ${T('جزئي، يُستكمل في الإصدارات التالية', 'partial, continues in next versions')}</p></div>`;
    $('#bk').onclick = () => download('geosurvey_backup.json', JSON.stringify(S), 'application/json');
    $('#rs').onchange = (e) => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const j = JSON.parse(r.result); if (!Array.isArray(j.projects)) throw new Error('bad'); S = Object.assign(def(), j); save(); applyTheme(); updateProjSel(); toast(T('تمت الاستعادة', 'Restored')); views.settings(); } catch (x) { toast(T('ملف غير صالح', 'Invalid file')); } }; r.readAsText(f); };
    let c = false; $('#wipe').onclick = function () { if (!c) { c = true; this.textContent = T('اضغط للتأكيد', 'Press to confirm'); return; } S = def(); save(); applyTheme(); updateProjSel(); route(); toast(T('تم المسح', 'Erased')); };
  };

  /* ---------- extension context (modules in app3/app4) ---------- */
  const ctx = { nav: [], views, $, esc, L, T, uid, toast, download, toCSV, toXLS, toolCard, setTitle, main, S: () => S, save, route: () => route(), printHTML: (h) => { $('#printArea').innerHTML = h; setTimeout(() => window.print(), 50); }, activeProject, updateProjSel, applyTheme, persistent: () => persistent, resetState: () => { S = def(); save(); } };
  ctx.log = (m) => { S.activity = S.activity || []; S.activity.unshift({ ts: Date.now(), m }); S.activity = S.activity.slice(0, 300); save(); };
  window.GSCtx = ctx;
  (window.GSExt || []).forEach((f) => f(ctx));

  /* ---------- shell ---------- */
  function applyTheme() { document.documentElement.dataset.theme = S.theme; document.documentElement.lang = S.lang; document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr'; }
  function nav() {
    const cur = location.hash || '#/dashboard';
    const a = (h, ic, t) => `<a href="${h}" class="${cur === h || cur.startsWith(h + '/') ? 'on' : ''}">${ic} <span>${esc(t)}</span></a>`;
    const E = {};
    const add = (h, ic, ar, en) => { E[h] = [h, ic, T(ar, en)]; };
    add('#/map', '🗺️', 'الخريطة التفاعلية', 'Interactive map'); add('#/courses', '🎬', 'الكورسات', 'Courses'); add('#/learn', '🎓', 'الدروس والتدريب', 'Lessons & training'); add('#/resources', '▶️', 'مصادر يوتيوب', 'YouTube'); add('#/commands', '⌨️', 'مكتبة الأوامر', 'Commands'); add('#/glossary', '📖', 'المصطلحات', 'Glossary'); add('#/assistant', '🤖', 'المساعد الهندسي', 'Assistant'); add('#/settings', '⚙️', 'الإعدادات والحالة', 'Settings & status');
    ctx.nav.forEach((n) => { E[n[0]] = [n[0], n[1], T(n[2], n[3])]; });
    const G = [
      [T('التعلم', 'Learn'), '🎓', ['#/academy', '#/learn', '#/courses', '#/quizbank', '#/training', '#/sims', '#/commands', '#/glossary', '#/resources', '#/library']],
      [T('الأدوات', 'Tools'), '🧮', null],
      [T('العمل والمشاريع', 'Work & projects'), '🏗️', ['#/map', '#/fieldbook', '#/analyzer', '#/reports']],
      [T('المهنة', 'Career'), '💼', ['#/career', '#/profile']],
      [T('المنصة', 'Platform'), '⚙️', ['#/assistant', '#/account', '#/admin', '#/settings', '#/status']]
    ];
    const used = new Set();
    const open = (items) => items.some(([h]) => cur === h || cur.startsWith(h + '/'));
    let html = a('#/dashboard', '🏠', T('لوحة التحكم', 'Dashboard')) + a('#/projects', '🗂️', T('المشاريع', 'Projects'));
    G.forEach(([title, ic, hs]) => {
      let items;
      if (hs) items = hs.filter((h) => E[h]).map((h) => { used.add(h); return E[h]; });
      else items = TOOLS.groups.map((g) => ['#/group/' + g.id, g.ic, L(g.t)]);
      const on = open(items) || (!hs && cur.startsWith('#/tool'));
      html += `<details${on ? ' open' : ''}><summary>${ic} ${esc(title)}</summary>${items.map((x) => a(x[0], x[1], x[2])).join('')}</details>`;
    });
    ['#/dashboard', '#/projects'].forEach((h) => used.add(h));
    const rest = Object.keys(E).filter((h) => !used.has(h) && h !== '#/dashboard' && h !== '#/projects');
    if (rest.length) html += `<details><summary>📦 ${T('أخرى', 'Other')}</summary>${rest.map((h) => a(E[h][0], E[h][1], E[h][2])).join('')}</details>`;
    $('#nav').innerHTML = html;
  }
  function updateProjSel() {
    const s = $('#psel'); s.innerHTML = `<option value="">${T('— بدون مشروع نشط —', '— no active project —')}</option>` + S.projects.filter((p) => !p.archived).map((p) => `<option value="${p.id}"${p.id === S.active ? ' selected' : ''}>${esc(p.name)}</option>`).join('');
  }
  function route() {
    const [h, qs] = (location.hash || '#/dashboard').slice(2).split('?'), [v, arg] = h.split('/');
    const q = Object.fromEntries(new URLSearchParams(qs || ''));
    if (v !== 'map' && map) { map.remove(); map = null; }
    nav(); $('aside').classList.remove('open'); window.scrollTo(0, 0);
    try { (v === 'projects' ? views.projects(q) : (views[v] || views.dashboard)(arg, q)); } catch (e) { main().innerHTML = `<div class="err">✘ ${esc(e.message)}</div>`; console.error(e); }
  }
  function init() {
    document.body.innerHTML = `<div id="app"><aside><div class="brand"><div class="logo">${window.GS_AVATAR ? `<img src="${window.GS_AVATAR}" alt="">` : '🧭'}</div><div><b>GeoSurvey Engineer Pro</b><small>v3.6 · Surveying · GIS · RS</small></div></div><nav id="nav"></nav></aside>
<div><main id="main-wrap" style="padding:0 22px"><header class="top"><button class="btn" id="menu">☰</button><h1 id="title"></h1><select id="psel" style="width:auto;max-width:190px"></select><button class="btn" id="lang">EN/عربي</button><button class="btn" id="theme">🌓</button></header><div id="main"></div></main></div></div><div id="printArea"></div>`;
    $('#menu').onclick = () => $('aside').classList.toggle('open');
    $('#theme').onclick = () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; save(); applyTheme(); };
    $('#lang').onclick = () => { S.lang = S.lang === 'ar' ? 'en' : 'ar'; save(); applyTheme(); updateProjSel(); route(); };
    $('#psel').onchange = (e) => { S.active = e.target.value || null; save(); toast(S.active ? T('المشروع النشط تغيّر', 'Active project changed') : T('لا مشروع نشط', 'No active project')); };
    applyTheme(); updateProjSel(); window.addEventListener('hashchange', route); route();
  }
  window.GSApp = { S: () => S, route };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script><script>if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}</script></body></html>
