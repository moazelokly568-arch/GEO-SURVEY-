input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);border-color:transparent}
.rg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.rv{background:var(--panel2);border-radius:10px;padding:10px 12px}.rv span{color:var(--mute);font-size:12.5px;display:block}.rv b{font-size:17px;direction:ltr;unicode-bidi:isolate;display:inline-block}.rv i{font-style:normal;color:var(--mute);margin-inline-start:6px;font-size:13px}
.warn{background:rgba(224,138,0,.13);border-inline-start:4px solid var(--warn);padding:8px 12px;border-radius:8px;margin:8px 0}
.err{background:rgba(194,58,58,.13);border-inline-start:4px solid var(--bad);padding:8px 12px;border-radius:8px;margin:8px 0;color:var(--bad)}
.note{color:var(--mute);font-size:13px;margin:6px 0}
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap;direction:ltr;text-align:right}th{background:var(--panel2);position:sticky;top:0;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.pill{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--panel2);color:var(--mute)}.pill.ok{background:rgba(27,138,75,.15);color:var(--ok)}
.bar{height:8px;background:var(--panel2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.opt{display:block;padding:7px 10px;border:1px solid var(--line);border-radius:9px;margin:4px 0;cursor:pointer}.opt input{width:auto;margin-inline-end:8px}.opt.right{border-color:var(--ok);background:rgba(27,138,75,.12)}.opt.wrong{border-color:var(--bad);background:rgba(194,58,58,.1)}
.lesson p,.lesson li{max-width:78ch}.lesson code{background:var(--panel2);padding:1px 6px;border-radius:5px;direction:ltr;unicode-bidi:isolate;display:inline-block}
#map{height:min(68vh,620px);border-radius:12px;border:1px solid var(--line);z-index:1}
.chat{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;padding:4px}
.msg{padding:9px 13px;border-radius:12px;max-width:88%;white-space:pre-wrap}.msg.u{background:var(--acc);color:#fff;align-self:flex-start}.msg.b{background:var(--panel2);align-self:flex-end}
.toast{position:fixed;bottom:18px;inset-inline-start:18px;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:99;box-shadow:var(--shadow)}
#printArea{display:none}
@media print{body>#app,.toast{display:none!important}#printArea{display:block;color:#000;background:#fff;padding:18px}#printArea table{font-size:11px}#printArea th{background:#eee}}
@media(max-width:860px){#app{grid-template-columns:minmax(0,1fr)}#app>div{min-width:0}aside{position:fixed;inset-block:0;inset-inline-start:0;width:270px;z-index:20;transform:translateX(100%);visibility:hidden;transition:.2s;box-shadow:var(--shadow)}[dir=ltr] aside{transform:translateX(-100%)}aside.open{transform:none!important;visibility:visible}#main-wrap{padding:0 12px!important}header.top{flex-wrap:wrap}header.top h1{flex-basis:100%;order:5;white-space:normal;font-size:16px}#menu{display:inline-flex}main{padding:0 12px 60px}}

.logo img{width:100%;height:100%;object-fit:cover;border-radius:10px}
nav details{margin:6px 0;border-top:1px solid var(--line);padding-top:4px}
nav summary{cursor:pointer;padding:8px 10px;font-weight:700;color:var(--mute);list-style:none;user-select:none}
nav summary::-webkit-details-marker{display:none}
nav summary::after{content:"▾";float:inline-end;opacity:.6}
nav details[open] summary::after{content:"▴"}
nav details a{padding-inline-start:20px}
.herocard{padding:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:0}
.herocard img{width:100%;height:100%;object-fit:cover;display:block;max-height:300px}
.herocard .ht{padding:18px;display:flex;flex-direction:column;justify-content:center;gap:8px}
@media(max-width:700px){.herocard{grid-template-columns:1fr}.herocard img{max-height:260px;object-position:top}}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0;font-size:13px}
.crumbs a{color:var(--acc);text-decoration:none}.crumbs span{color:var(--mute)}.crumbs i{opacity:.5;font-style:normal}
@media print{.crumbs{display:none}}

</script><script>/* Learning content: lessons, glossary, quizzes. Textbook-level facts only. Labels 'عربي|English'. */

  const lessons = [
    { id: 'l1', lv: 'beginner', sec: 'مبادئ المساحة|Surveying basics', t: 'أساسيات المساحة والقياسات|Surveying fundamentals', pts: 10,
      body: `<p>المساحة (Surveying) هي علم تحديد المواقع النسبية للنقاط على سطح الأرض أو فوقه أو تحته، وتوقيعها على الطبيعة.</p>
<ul><li><b>Horizontal Distance</b>: المسافة الأفقية، وهي التي تُستخدم في الخرائط والإحداثيات.</li><li><b>Azimuth</b>: الزاوية من الشمال مع عقارب الساعة (0–360°). <b>Bearing</b>: زاوية من الشمال أو الجنوب نحو الشرق أو الغرب (0–90°).</li><li><b>Accuracy</b> الدقة مقابل الحقيقة، <b>Precision</b> التكرارية بين القياسات.</li><li>أنواع الأخطاء: جسيمة (Blunders)، منتظمة (Systematic)، عشوائية (Random).</li></ul>
<p>الدقة النسبية لضلع أو Traverse = خطأ الإغلاق ÷ مجموع الأطوال (مثال 1:5000).</p>`,

    { id: 'l2', lv: 'beginner', sec: 'الميزانية|Leveling', t: 'الميزانية: BS و FS و HI|Leveling: BS, FS, HI', pts: 10,
      body: `<p>تستخدم الميزانية لتحديد فروق المناسيب بجهاز Level ومسطرة (Staff).</p>

    { id: 'l3', lv: 'beginner', sec: 'الحسابات|Calculations', t: 'الإحداثيات والـ Traverse|Coordinates & traverse', pts: 15,
      body: `<p>من نقطة معلومة (E,N) واتجاه Azimuth ومسافة D: <b>ΔE = D·sin(Az)</b> و <b>ΔN = D·cos(Az)</b>.</p>
<p>في Traverse المقفل يجب أن يكون ΣΔE=0 و ΣΔN=0؛ الفرق هو خطأ الإغلاق. طريقة <b>Bowditch</b> توزع التصحيح بنسبة طول الضلع إلى المحيط.</p>

    { id: 'l6', lv: 'intermediate', sec: 'الإحداثيات|Coordinates', t: 'Datum والإسقاط وUTM|Datum, projection & UTM', pts: 15,
      body: `<p><b>Datum</b> يحدد المجسّم (Ellipsoid) وموضعه بالنسبة للأرض. WGS84 هو Datum نظام GPS.</p>
<p><b>UTM</b> إسقاط Transverse Mercator مقسّم إلى 60 نطاقًا عرض كل منها 6°، معامل المقياس على الخط المركزي 0.9996، والـ False Easting = 500,000 م. للنصف الجنوبي False Northing = 10,000,000 م. رقم النطاق = ⌊(Lon+180)/6⌋+1.</p>
<p>مصر تقع في النطاقات 35 و36 و37 تقريبًا. تحويل الإحداثيات بين Datums المختلفة يتطلب بارامترات معتمدة، لذلك لا يجب تخمينها.</p>`,

      body: `<p>بيانات GIS: <b>Vector</b> (نقاط وخطوط ومضلعات) و<b>Raster</b> (خلايا بقيم).</p>

<p>قبل أي تحليل مسافات أو مساحات: تأكد أن الطبقات في نظام إسقاط مناسب وبوحدة المتر وليس درجات.</p>`,

  add({ id: 'l19', lv: 'beginner', sec: 'الموقع|Site', t: 'من استلام الموقع حتى التسليم|Site handover to delivery', pts: 15, tool: 'axis-setout',
    body: `<ol><li><b>استلام الموقع</b>: مراجعة اللوحات، حدود الأرض، نقاط التحكم المعتمدة وإحداثياتها وBM، وتوثيق الحالة الراهنة (رفع كنتوري قبل الأعمال).</li><li><b>إنشاء شبكة تحكم</b> بنقاط ثابتة محمية خارج منطقة الحفر، وفحصها دوريًا.</li><li><b>توقيع الحدود والمحاور</b> ثم الأعمدة والقواعد بالإحداثيات من نقاط التحكم.</li><li><b>أعمال الحفر</b>: توقيع حدود الحفر ومناسيب القاع بالميزانية، والتحقق قبل الصب.</li><li><b>الأعمال الخرسانية</b>: فحص أبعاد وأقطار الشدات (Squareness) ومناسيب الصب وراسية الأعمدة.</li><li><b>الردم والتسوية</b>: مناسيب طبقات الردم والدمك.</li><li><b>As-Built</b>: رفع ما تم تنفيذه ومطابقته للتصميم بسماحيات المواصفة.</li><li><b>التسليم</b>: لوحات As-Built، حساب كميات، وتقرير مساحي بنقاط التحكم والدقة.</li></ol>`,
    quiz: [Q('أين تُنشأ نقاط التحكم؟|Where to set control points?', ['خارج منطقة الأعمال ومحمية|Outside works and protected', 'داخل الحفر|Inside the excavation', 'فوق الخرسانة|On concrete'], 0)] });
  add({ id: 'l20', lv: 'beginner', sec: 'الموقع|Site', t: 'توقيع المباني: المحاور والأعمدة|Building setting-out', pts: 10, tool: 'square-check',
    body: `<ul><li>أنشئ <b>خط أساس</b> من نقطتي تحكم ثم وقّع المحاور بمسافات وإزاحات (Along/Offset).</li><li>تحقق من <b>التعامد</b> بتساوي القطرين وبالقياس 3-4-5 كاختبار تقريبي.</li><li>ثبّت <b>Batter boards</b> (لوحات الشدادات) خارج حفر الأساس ليُعاد منها تعليم المحاور.</li><li>انقل المناسيب من BM إلى مستوى مرجعي ثابت (مثلاً مستوى الصفر المعماري) وعلّمه على الجدران أو الأعمدة.</li><li>راجع راسية الأعمدة بالشاغول أو التوتال.</li></ul>`,
    quiz: [Q('اختبار تقريبي للتعامد|Quick squareness test', ['3-4-5', '1-1-1', '2-2-5'], 0)] });
  add({ id: 'l21', lv: 'beginner', sec: 'AutoCAD', t: 'مخطط مساحي في AutoCAD خطوة بخطوة|Survey drawing workflow', pts: 10,
    body: `<ol><li>اضبط الوحدات <code>UNITS</code> (متر) وارسم بإحداثيات حقيقية (لا تحرك الرسم عن مكانه).</li><li>أنشئ Layers: نقاط، أسماء، مناسيب، حدود، مباني، كنتور، شبكة، إطار.</li><li>استورد النقاط: أسهل طريقة ملف CSV بنص أوامر أو Script، أو استخدم Civil 3D/برنامج وسيط؛ لا تكتب النقاط يدويًا.</li><li>ارسم الحدود بـ <code>PLINE</code> وتأكد من إغلاقها (<code>Close</code>) ثم استعمل <code>AREA</code>/<code>LIST</code> للمساحة.</li><li>ضع النصوص والأبعاد بمقياس الطباعة المناسب (<code>DIMSCALE</code> أو Annotative).</li><li>جهّز <code>LAYOUT</code> بـ Viewport بمقياس رسم معلوم ثم <code>PLOT</code> إلى PDF.</li></ol>`,
    quiz: [Q('لقياس مساحة Polyline مغلقة|Area of a closed polyline', ['AREA أو LIST', 'COPY', 'ROTATE'], 0)] });
  add({ id: 'l22', lv: 'advanced', sec: 'Civil 3D', t: 'Civil 3D: النقاط والأسطح|Civil 3D: points & surfaces', pts: 10,
    body: `<ul><li><b>Points</b>: Create Points ← Import Points (PNEZD أو PENZD…) واختر التنسيق الصحيح لملفك. نظّمها في <b>Point Groups</b> (أرض، حدود، BM…).</li><li><b>Surface</b>: Create Surface (TIN) ثم أضف Point Group أو DEM أو Contours. استخدم <b>Breaklines</b> (حواف الطرق، قنوات) لتحكم المثلثات.</li><li>راجع Surface: أعلى/أدنى منسوب وأي مثلثات طويلة خارج الحدود، واستعمل <b>Boundary</b> لإخفاء مثلثات خارجية.</li><li>اعرض Contours بمتباعدة مناسبة (Minor/Major) واستخرج Surface Analysis (Slope, Elevation).</li></ul>`,
    quiz: [Q('Breaklines تُستخدم لـ|Breaklines are used to', ['التحكم في شكل المثلثات عند الحواف|Control TIN along edges', 'طباعة اللوحة|Plot', 'تغيير الوحدات|Change units'], 0)] });
  add({ id: 'l23', lv: 'advanced', sec: 'Civil 3D', t: 'Civil 3D: المحاور والقطاعات والكوريدور|Civil 3D: alignments, profiles, corridors', pts: 10,
    body: `<ol><li><b>Alignment</b>: Create Alignment by Layout (PI) مع منحنيات حسب سرعة التصميم، أو من Polyline.</li><li><b>Profile</b>: Create Surface Profile (الأرض الحالية) ثم Create Profile by Layout (Finished Ground) مع Vertical curves.</li><li><b>Assembly</b>: قطاع نموذجي (حارات، أكتاف، ميول) وفق المواصفة.</li><li><b>Corridor</b>: يجمع Alignment + Profile + Assembly وينتج سطح التصميم.</li><li><b>Sample Lines + Sections</b> لرسم القطاعات العرضية.</li><li><b>Volumes</b>: Compute Materials أو Volume Surface (TIN Volume) بين الأرض والتصميم.</li></ol>`,
    quiz: [Q('Corridor يربط|Corridor combines', ['Alignment + Profile + Assembly', 'Layers فقط|Layers only', 'Blocks فقط|Blocks only'], 0)] });
  add({ id: 'l24', lv: 'intermediate', sec: 'GIS', t: 'مشروع GIS في QGIS/ArcGIS Pro|Starting a GIS project', pts: 15,
    body: `<ol><li>ابدأ بتحديد <b>CRS</b> للمشروع. فرّق بين <b>Define Projection</b> (تعريف النظام لطبقة معرّفها غلط/ناقص دون تغيير الإحداثيات) و<b>Reproject/Project</b> (تحويل الإحداثيات فعليًا).</li><li>استورد CSV بنقاط X/Y أو Lat/Lon (Add Delimited Text / XY Table To Point) واختر CRS الحقول الصحيح.</li><li>رقمنة (Digitizing) الحدود والمباني فوق صورة أو خريطة مرجعية مع طبقات بتخزين مناسب (GeoPackage أو File Geodatabase).</li><li><b>Georeferencing</b>: أضف نقاط تحكم (GCPs) موزعة بانتظام، اختر تحويلًا مناسبًا (Polynomial/Spline) وراجع RMSE.</li><li>التحليل: Buffer، Clip، Intersect، Union، Dissolve، Spatial Join، ثم Raster: Slope، Aspect، Hillshade، Contour من DEM.</li><li>اخرج خريطة بمقياس ورسوم وأسطورة واتجاه الشمال ومصدر البيانات.</li></ol>`,
    quiz: [Q('Define Projection تفعل|Define Projection does', ['تعرّف النظام دون تغيير الإحداثيات|Labels CRS without changing coords', 'تحول الإحداثيات|Converts coordinates', 'تقص الطبقة|Clips'], 0)] });
  add({ id: 'l25', lv: 'advanced', sec: 'الاستشعار عن بعد|Remote sensing', t: 'تصنيف الصور وتقييم الدقة|Classification & accuracy assessment', pts: 15, tool: 'indices',
    body: `<ol><li>اختر المشهد: تاريخ مناسب وسحب قليلة، ومستشعر بدقة تناسب المطلوب.</li><li>تصحيح: إشعاعي وجوي (Surface Reflectance) وهندسي (Co-registration) إن لزم.</li><li>تحديد الفئات (Land Use / Land Cover) ثم جمع عينات تدريب موزعة تمثل كل فئة.</li><li>تصنيف: بإشراف (Random Forest، Maximum Likelihood…) أو بدون إشراف (K-means/ISODATA).</li><li>تقييم الدقة بعينات اختبار مستقلة: <b>Confusion Matrix</b> و<b>Overall Accuracy</b> و<b>Kappa</b> ودقة المنتج والمستخدم.</li><li><b>Change Detection</b>: قارن تصنيفين أو مؤشرين (Difference) لمشهدين بنفس الموسم.</li></ol>
<p><b>LST</b> (حرارة السطح) تُشتق من النطاق الحراري: تحويل DN لإشعاع ثم درجة حرارة سطوع ثم تصحيح الانبعاثية؛ معاملات المعايرة تُؤخذ من وصف بيانات المشهد الرسمي.</p>`,
    quiz: [Q('تقييم دقة التصنيف يتم بـ|Accuracy assessment uses', ['Confusion Matrix على عينات اختبار مستقلة|Confusion matrix with independent samples', 'نفس عينات التدريب فقط|Training samples only', 'لا حاجة له|Not needed'], 0)] });
  add({ id: 'l26', lv: 'advanced', sec: 'الاستشعار عن بعد|Remote sensing', t: 'Google Earth Engine: أول سكريبت|Google Earth Engine first script', pts: 10,
    body: `<p>GEE منصة سحابية مجانية للاستخدام غير التجاري بحساب مسجل، وتتطلب إنترنت. الفكرة: مجموعة صور (ImageCollection) ← تصفية بالمكان والتاريخ والسحب ← حساب مؤشر ← عرض أو تصدير.</p>
<pre class="num" style="white-space:pre-wrap;direction:ltr;text-align:left;background:var(--panel2);padding:10px;border-radius:8px">var aoi = ee.Geometry.Point([31.24, 30.05]).buffer(5000);
var s2 = ee.ImageCollection('COPERNICUS/S2_SR_HARMONIZED')
  .filterBounds(aoi).filterDate('2024-01-01','2024-12-31')
  .filter(ee.Filter.lt('CLOUDY_PIXEL_PERCENTAGE', 20));
var ndvi = s2.median().normalizedDifference(['B8','B4']).rename('NDVI');
Map.centerObject(aoi, 12);
Map.addLayer(ndvi.clip(aoi), {min:0, max:0.8, palette:['white','green']}, 'NDVI');</pre>
<p>تنبيه: تحقق من اسم مجموعة البيانات الحالي في Earth Engine Data Catalog لأن الأسماء والإصدارات قد تتغير. الكود مثال تعليمي لم يُشغَّل داخل هذا التطبيق.</p>`,
    quiz: [Q('ما النطاقان المستخدمان لـ NDVI في Sentinel-2؟|NDVI bands in Sentinel-2', ['B8 و B4', 'B2 و B3', 'B11 و B12'], 0)] });
  add({ id: 'l27', lv: 'advanced', sec: 'الاستشعار عن بعد|Remote sensing', t: 'التصوير الجوي والدرون: GSD|Photogrammetry & UAV: GSD', pts: 10,
    body: `<ul><li><b>GSD</b> (حجم البكسل على الأرض) = (حجم بكسل الحساس × ارتفاع الطيران) ÷ البعد البؤري. مثال: بكسل 2.4 µm، ارتفاع 100 م، بعد بؤري 8.8 مم ← GSD ≈ 2.7 سم.</li><li>تداخل الصور الشائع: أمامي 70–80% وجانبي 60–70% (حسب التضاريس والمواصفة).</li><li><b>GCPs</b> موزعة بانتظام + Check points لتقييم الدقة؛ الدقة المطلقة تعتمد على التحكم لا على الدرون فقط.</li><li>المخرجات: Orthomosaic وDSM وDTM ونقاط سحابية، من برامج مثل Metashape أو Pix4D أو OpenDroneMap.</li></ul>`,

</script><script>/* v3 module B: simulators (leveling, total station, stakeout) + Practical Training Center */
(window.GSExt = window.GSExt || []).push((ctx) => {
  const { views, $, esc, T, toast, setTitle, main } = ctx;

  const mul = (a) => () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const mk = (seed) => { const r = mul(seed); r.int = (a, b) => a + Math.floor(r() * (b - a + 1)); r.f = (a, b, d = 3) => +(a + r() * (b - a)).toFixed(d); r.g = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }; r.pick = (a) => a[Math.floor(r() * a.length)]; return r; };
  const rnd3 = (x) => Math.round(x * 1000) / 1000;
  const newSeed = () => Math.floor(Math.random() * 900000) + 100000;
  const train = () => { const s = S(); if (!s.train) s.train = { hist: [] }; return s.train; };
  const record = (type, diff, score, extra) => { train().hist.unshift({ ts: Date.now(), type, diff, score, ...extra }); train().hist = train().hist.slice(0, 200); ctx.save(); if (ctx.log) ctx.log(`${type} ${score}%`); };
  const val = (id) => { const v = $('#' + id).value.trim(); if (v === '') return NaN; try { return G.num(v); } catch (e) { return NaN; } };
  const ang = (id) => { const v = $('#' + id).value.trim(); if (v === '') return NaN; try { return G.angle(v); } catch (e) { return NaN; } };
  const mark = (el, ok) => { el.classList.remove('okf', 'badf'); el.classList.add(ok ? 'okf' : 'badf'); el.style.outline = ok ? '2px solid var(--ok)' : '2px solid var(--bad)'; };
  const DISC = () => `<div class="warn">⚠ ${T('محاكاة تعليمية بحتة. لا تمثل أداء جهاز مساحي حقيقي، ولا يصلح هاتفك أو هذا التطبيق بديلًا عن جهاز مساحي دقيق عند التنفيذ.', 'Educational simulation only. It does not represent a real instrument and neither a phone nor this app replaces a precise survey instrument for real work.')}</div>`;
  const diffSel = (id = 'df') => `<select id="${id}" style="width:auto"><option value="1">${T('سهل', 'Easy')}</option><option value="2">${T('متوسط', 'Medium')}</option><option value="3">${T('صعب', 'Hard')}</option></select>`;

  /* ================= leveling simulator (pure parts exported for tests) ================= */
  function levGen(seed, diff) {
    const r = mk(seed), nS = 2 + diff, rl0 = r.f(10, 90, 3), rls = [rl0]; let rl = rl0;

  views.sims = () => {

    main().innerHTML = `<div class="card"><h2>${T('المحاكيات التعليمية', 'Training simulators')}</h2>${DISC()}<div class="grid g3">

<a class="tool" href="#/sim/stake"><span class="ic">📍</span><b>${T('محاكي التوقيع', 'Stakeout simulator')}</b><small>${T('احسب فرق الإحداثيات وحرّك العاكس حتى السماحية', 'Compute deltas and move the prism to tolerance')}</small></a></div>
<p class="note">${T('كل سيناريو يتولد عشوائيًا (برقم Seed قابل للإعادة) وتُصحَّح إجاباتك بنفس معادلات الأدوات.', 'Every scenario is randomly generated (repeatable seed) and graded with the same formulas as the tools.')}</p></div>`;
  };

  function simLevel() {

    main().innerHTML = `<div class="card"><div class="row"><h2 class="sp">${T('محاكي الميزانية (طريقة HI)', 'Leveling simulator (HI method)')}</h2>${diffSel()}<input id="sd" placeholder="Seed" style="width:110px"><button class="btn pri" id="gen">${T('سيناريو جديد', 'New scenario')}</button></div>${DISC()}
<p class="note">${T('معطى: منسوب BM1. الدورة تبدأ وتنتهي على BM1. أدخل HI بعد كل قراءة خلفية، وRL لكل محطة، ثم خطأ الإغلاق (مم) وقرر القبول. ثابت السماحية 12 مم/√كم لأغراض التمرين فقط؛ المواصفة الحقيقية قد تختلف.', 'Given: RL of BM1. The loop starts and ends on BM1. Enter HI after each backsight, RL of each station, the misclosure (mm), then decide. Tolerance constant 12 mm/√km is for this exercise only; real specs differ.')}</p><div id="sc"></div></div>`;
    const gen = () => {
      const seed = $('#sd').value.trim() ? +$('#sd').value : newSeed(), df = +$('#df').value, sc = levGen(seed, df), sol = levSolve(sc);

  Ls('s1', 's1-1', 0, 'مقدمة في علم المساحة وأنواعها', { kw: 'surveying types geodetic plane', g: 'أن تعرّف المساحة وتفرّق بين أنواعها الرئيسية وتعرف مجالات استخدامها.', s: 'المساحة (Surveying) هي علم قياس المسافات والزوايا والمناسيب على الأرض أو فوقها لتحديد مواقع النقاط ثم رسمها على خرائط أو نقلها من الرسم إلى الأرض.', d: 'تنقسم المساحة عادة إلى مساحة مستوية (Plane Surveying) تتجاهل انحناء الأرض وتصلح للمناطق الصغيرة، ومساحة جيوديسية (Geodetic Surveying) تأخذ شكل الأرض في الاعتبار للمساحات الكبيرة والشبكات الوطنية.\nمن الأنواع حسب الغرض: المساحة الطبوغرافية لرسم الأرض وتضاريسها، ومساحة الملكيات والحدود (Cadastral)، ومساحة الإنشاءات للتوقيع، ومساحة الطرق، والمساحة الهيدروغرافية للمسطحات المائية.\nالعمل المساحي له دورتان: الرفع (Surveying) أي نقل الواقع إلى أرقام ورسم، والتوقيع (Setting-out) أي نقل التصميم إلى الأرض.', terms: [T1('Plane surveying', 'مساحة مستوية'), T1('Geodetic surveying', 'مساحة جيوديسية'), T1('Cadastral', 'مساحة الملكيات'), T1('Setting-out', 'التوقيع')], ex: 'قطعة أرض 5000 م² يمكن رفعها بمساحة مستوية بلا مشكلة. أما شبكة تحكم تغطي محافظة فتحتاج حسابات جيوديسية.', app: 'اكتب أمثلة من مدينتك لكل نوع: مشروع طريق، تسجيل أرض، حفر أساسات.', tr: ['صنّف الأعمال التالية إلى رفع أو توقيع: (أ) قياس حدود أرض قائمة (ب) تعليم أعمدة مبنى جديد.', '(أ) رفع. (ب) توقيع.'], rv: ['المساحة تقيس وتحدد المواقع.', 'المستوية للمساحات الصغيرة، والجيوديسية للكبيرة.', 'الرفع غير التوقيع.'], q: [['أي مما يلي مساحة جيوديسية؟', ['رفع غرفة', 'شبكة تحكم وطنية', 'قياس طول سور'], 1, 'الشبكات الكبيرة تحتاج أخذ شكل الأرض في الاعتبار.'], ['نقل أماكن الأعمدة من المخطط إلى الأرض يسمى:', ['رفع', 'توقيع', 'ميزانية'], 1, 'التوقيع Setting-out.'], ['المساحة المستوية تتجاهل:', ['الأطوال', 'انحناء الأرض', 'الزوايا'], 1, '']] });
  Ls('s1', 's1-2', 0, 'مبادئ القياس ووحدات القياس', { kw: 'units measurement metric feddan', g: 'أن تستخدم وحدات الطول والمساحة والزوايا وتحوّل بينها دون أخطاء.', s: 'كل قياس رقم ووحدة. نسيان الوحدة أو خلطها أخطر أخطاء المساحة.', d: 'وحدة الطول الأساسية المتر (m). المساحة بالمتر المربع (m²) والحجم بالمتر المكعب (m³). في مصر تُستخدم أيضًا وحدات الأراضي: الفدان = 4200.833 م² تقريبًا والقيراط والسهم.\nالزوايا: الدرجة (Degree) والدقيقة والثانية (1° = 60′ ، 1′ = 60″) والراديان والجراد (Gon). 360° = 400 gon = 2π rad.\nمبدأ القياس: لا يوجد قياس مطلق الدقة، فلكل قياس خطأ. نكرر القياس ونحسب المتوسط ونتحقق بطريقة مستقلة.', terms: [T1('Metre', 'متر'), T1('Feddan', 'فدان'), T1('Radian', 'راديان'), T1('Gon', 'جراد')], ex: '1 هكتار = 10000 م². إذن 2.4 فدان = 2.4 × 4200.833 = 10082.0 م² تقريبًا = 1.008 هكتار.', app: 'حوّل قطعة 3 أفدنة إلى م² وهكتار بأداة «محول الوحدات» وتحقق يدويًا.', tool: 'units', tr: ['حوّل 45°30′ إلى درجات عشرية.', '45 + 30/60 = 45.5°'], rv: ['اكتب الوحدة دائمًا.', '1 فدان = 4200.833 م² تقريبًا.', '1° = 60′ = 3600″.'], q: [['كم يساوي 1 هكتار؟', ['1000 م²', '10000 م²', '100 م²'], 1, ''], ['30′ بالدرجات =', ['0.3°', '0.5°', '0.05°'], 1, '30/60 = 0.5'], ['أكبر خطر في الوحدات هو:', ['كتابة الوحدة', 'خلط الوحدات', 'استخدام المتر'], 1, '']] });
  Ls('s1', 's1-3', 0, 'قياس المسافات والزوايا', { kw: 'distance tape angle horizontal vertical', g: 'أن تعرف طرق قياس المسافات والزوايا وأخطائها الشائعة.', s: 'المسافة تقاس بالشريط أو بالجهاز الإلكتروني (EDM) والزاوية بالثيودوليت أو التوتال ستيشن. المهم أن المسافة المطلوبة في الخرائط أفقية.', d: 'المسافة المائلة (Slope Distance) تختلف عن الأفقية (Horizontal Distance): HD = SD × cos(α) حيث α زاوية الميل عن الأفق، أو HD = SD × sin(Z) إذا كانت Z زاوية رأسية من السمت (Zenith).\nالزاوية الأفقية تقاس بين اتجاهين في مستوى أفقي، والرأسية في مستوى رأسي.\nأخطاء الشريط: عدم الشد المنتظم، عدم الاستقامة، الميل، الحرارة. أخطاء الجهاز: التمركز والتسوية والتصويب.', terms: [T1('Slope distance', 'مسافة مائلة'), T1('Horizontal distance', 'مسافة أفقية'), T1('Zenith angle', 'زاوية سمتية'), T1('EDM', 'قياس المسافة الإلكتروني')], ex: 'SD = 52.340 م وزاوية سمتية Z = 88°30′. HD = 52.340 × sin(88.5°) = 52.318 م تقريبًا.', app: 'استخدم «حاسبة الميل» لحساب HD وΔh من SD وZ.', tool: 'slope', tr: ['SD = 100.000 م والميل 5°. احسب HD.', '100 × cos 5° = 99.619 م'], rv: ['الخرائط تستخدم المسافة الأفقية.', 'HD = SD·sin(Z).'], q: [['HD = SD × ؟ إذا كانت Z زاوية سمتية', ['cos Z', 'sin Z', 'tan Z'], 1, 'من السمت: الأفقي = SD sin Z'], ['الزاوية السمتية تقاس من:', ['الأفق', 'السمت (للأعلى)', 'الشمال'], 1, ''], ['EDM يقيس:', ['الزوايا', 'المسافات', 'المناسيب فقط'], 1, '']] });
  Ls('s1', 's1-4', 0, 'الاتجاهات: Azimuth وBearing', { kw: 'azimuth bearing quadrant', g: 'أن تحوّل بين السمت والاتجاه الربعي وتحسبهما من الإحداثيات.', s: 'السمت (Azimuth) زاوية من الشمال مع عقارب الساعة (0–360°). الاتجاه الربعي (Bearing) زاوية حادة من الشمال أو الجنوب نحو الشرق أو الغرب.', d: 'من الإحداثيات: Az = atan2(ΔE, ΔN) ثم نضيف 360 إن كانت سالبة.\nتحويل السمت إلى Bearing: ربع أول (0–90): N Az E. ربع ثان (90–180): S (180−Az) E. ربع ثالث (180–270): S (Az−180) W. ربع رابع (270–360): N (360−Az) W.\nالاتجاه العكسي (Back azimuth) = Az ± 180°.', terms: [T1('Azimuth', 'سمت'), T1('Bearing', 'اتجاه ربعي'), T1('Back azimuth', 'السمت العكسي')], ex: 'Az = 225° → ربع ثالث → S 45° W. Back azimuth = 45°.', app: 'من A(1000,1000) إلى B(1100,1100): ΔE=ΔN=100 → Az=45° (N45°E). تحقق بأداة Inverse.', tool: 'inverse', tr: ['حوّل S 30° E إلى سمت.', '180 − 30 = 150°'], rv: ['Az من الشمال مع عقارب الساعة.', 'العكسي ±180°.'], q: [['Az = 300° تعني Bearing:', ['N 60° W', 'S 60° W', 'N 30° E'], 0, '360−300 = 60 في الربع الرابع'], ['السمت العكسي لـ 20°:', ['200°', '110°', '340°'], 0, ''], ['Az = atan2 ؟', ['(ΔN, ΔE)', '(ΔE, ΔN)', '(E, N)'], 1, 'الشمال هو المحور المرجعي']] });
  Ls('s1', 's1-5', 0, 'الإحداثيات الأولى: حساب النقطة من النقطة', { kw: 'forward inverse polar coordinates', g: 'أن تحسب إحداثيات نقطة من نقطة أخرى بالسمت والمسافة (Forward) والعكس (Inverse).', s: 'نعرف نقطة A ونقيس سمتًا ومسافة فنعرف B. أو نعرف النقطتين ونحسب السمت والمسافة بينهما.', d: 'Forward: E_B = E_A + d·sin(Az) ، N_B = N_A + d·cos(Az).\nInverse: d = √(ΔE² + ΔN²) ، Az = atan2(ΔE, ΔN).\nأحرف E وN هي إحداثيات شرقية وشمالية في نظام مستوٍ ما: لا تفترض أي نظام، سجّله دائمًا.', terms: [T1('Easting', 'إحداثي شرقي'), T1('Northing', 'إحداثي شمالي'), T1('Forward', 'حساب أمامي'), T1('Inverse', 'حساب عكسي')], ex: 'A(500, 800)، Az=60°، d=100: E_B = 500 + 100·sin60 = 586.603 ، N_B = 800 + 100·cos60 = 850.000.', app: 'جرّب أداة «حساب نقطة (Polar)» بنفس القيم وتحقق.', tool: 'polar', tr: ['A(0,0)، Az=90°، d=50. أوجد B.', 'E=50، N=0'], rv: ['E مع sin وN مع cos.', 'سجّل نظام الإحداثيات.'], q: [['E_B = E_A + d × ؟', ['cos Az', 'sin Az', 'tan Az'], 1, 'السمت من الشمال'], ['Inverse يعطي:', ['السمت والمسافة', 'المنسوب فقط', 'المساحة'], 0, ''], ['النظام المستخدم يجب:', ['يُخمّن', 'يُسجَّل', 'يُتجاهل'], 1, '']] });

  Ls('s2', 's2-1', 1, 'أنظمة الإحداثيات والداتم والمساقط', { kw: 'datum projection coordinate system', g: 'أن تفهم الفرق بين الإحداثيات الجغرافية والمستوية وأن الداتم والمسقط يحددان معنى الأرقام.', s: 'نفس النقطة لها أرقام مختلفة حسب النظام. لذلك لا يكفي أن تقول E وN: يجب معرفة الـ Datum والـ Projection والوحدات.', d: 'الإحداثيات الجغرافية (خط عرض φ وخط طول λ) تحدد الموقع على مجسم ناقص (Ellipsoid). الداتم (Datum) يربط المجسم بالأرض الفعلية. المسقط (Projection) يحوّل السطح المنحني إلى مستوٍ فتظهر إحداثيات مستوية (E,N) بالمتر.\nالمسقط يسبب تشوهات صغيرة في المسافة، لذا توجد عوامل مقياس (Scale Factor) في الأعمال الدقيقة.\nلا تخمّن النظام أبدًا: اسأل عن EPSG أو اقرأ ملف الوصف. خطأ الداتم قد يزيح النقطة عشرات إلى مئات الأمتار.', terms: [T1('Datum', 'نظام مرجعي'), T1('Ellipsoid', 'مجسم ناقص'), T1('Projection', 'مسقط'), T1('Scale factor', 'معامل المقياس'), T1('EPSG', 'كود EPSG')], ex: 'EPSG:4326 = WGS84 جغرافي (درجات). EPSG:32636 = WGS84 / UTM 36N (متر).', app: 'في التطبيق: عند إنشاء مشروع سجّل نظام الإحداثيات. التطبيق لا يحوّل تلقائيًا ولا يخمّن.', tr: ['لماذا لا يصح خلط نقطتين من نظامين مختلفين؟', 'لأن الأرقام تقع على أسطح ومساقط مختلفة فتظهر إزاحات كبيرة.'], rv: ['Datum + Projection + Units = النظام.', 'سجّل CRS ولا تخمّنه.'], q: [['المسقط يحوّل:', ['المنسوب إلى المتر', 'سطحًا منحنيًا إلى مستوٍ', 'الزاوية إلى مسافة'], 1, ''], ['EPSG هو:', ['اسم جهاز', 'كود لتعريف نظام إحداثيات', 'وحدة'], 1, ''], ['خطأ الداتم يسبب:', ['لا شيء', 'إزاحة في المواقع', 'تغيير الوحدات فقط'], 1, '']] });
  Ls('s2', 's2-2', 1, 'WGS84 وUTM', { kw: 'wgs84 utm zone', g: 'أن تعرف نطاقات UTM وتحدد نطاق نقطة في مصر.', s: 'WGS84 هو النظام العالمي لـ GPS. وUTM يقسم الأرض إلى نطاقات عرض كل منها 6° طولًا ليعطي إحداثيات بالمتر.', d: 'رقم النطاق = floor((λ + 180) / 6) + 1. مصر تمتد تقريبًا من 25°E إلى 36°E فتقع في النطاقات 35 (24°–30°E) و36 (30°–36°E).\nإحداثي الشرق يبدأ بـ 500000 م (False Easting) عند خط الوسط. في نصف الكرة الشمالي False Northing = 0.\nUTM مسقط Transverse Mercator بمعامل مقياس 0.9996 على خط الوسط.', terms: [T1('UTM zone', 'نطاق UTM'), T1('False Easting', 'الإزاحة الشرقية الزائفة'), T1('Central meridian', 'خط الطول المركزي')], ex: 'الزقازيق λ ≈ 31.5°E → floor(211.5/6)+1 = 36. النطاق 36N.', app: 'حوّل نقطة بأداة «تحويل الإحداثيات» وراجع النطاق الذي اختاره التطبيق.', tool: 'coord', tr: ['λ = 29.9°E. ما النطاق؟', 'floor(209.9/6)+1 = floor(34.98)+1 = 35'], rv: ['النطاق = floor((λ+180)/6)+1.', 'مصر: 35 و36 غالبًا.'], q: [['عرض نطاق UTM:', ['3°', '6°', '10°'], 1, ''], ['إحداثي الشرق عند خط الوسط:', ['0', '500000', '1000000'], 1, ''], ['λ=33°E في النطاق:', ['35', '36', '37'], 1, '(33+180)/6=35.5 → 36']] });
  Ls('s2', 's2-3', 1, 'قراءة الخرائط ومقياس الرسم', { kw: 'map scale reading', g: 'أن تقرأ مقياس الرسم وتحوّل المسافات بين الخريطة والأرض.', s: 'مقياس 1:1000 يعني أن 1 سم على الخريطة = 1000 سم = 10 م على الأرض.', d: 'مسافة الأرض = مسافة الخريطة × مقام المقياس. المساحة تتحول بمربع المقياس.\nالمقياس الخطي (Scale bar) أفضل عند التصغير أو التكبير لأنه يتغير مع الصورة.\nخطوط الكنتور (Contours) تصل نقاطًا متساوية المنسوب، وتقاربها يعني ميلًا شديدًا. الرموز والمفتاح (Legend) تفسّر العناصر.', terms: [T1('Scale', 'مقياس'), T1('Contour', 'كنتور'), T1('Legend', 'مفتاح الخريطة')], ex: 'قطعة 8.5 سم على خريطة 1:2000 = 170 م على الأرض.', app: 'اطبع خريطة وتحقق من مقياسها بمسطرة وشريط المقياس.', tr: ['مساحة 4 سم² على خريطة 1:500. كم م²؟', '4 × 500² = 4 × 250000 سم² = 1,000,000 سم² = 100 م²'], rv: ['المسافة × المقام.', 'المساحة × مربع المقام.'], q: [['1:5000: 2 سم =', ['100 م', '10 م', '1000 م'], 0, '2×5000=10000 سم=100 م'], ['الكنتور المتقارب يعني:', ['ميل خفيف', 'ميل شديد', 'مستوٍ'], 1, ''], ['شريط المقياس يفيد عند:', ['تغيير حجم الصورة', 'الطباعة فقط', 'لا يفيد'], 0, '']] });
  Ls('s2', 's2-4', 1, 'أخطاء القياس والدقة', { kw: 'errors precision accuracy blunder systematic random', g: 'أن تفرّق بين الأخطاء الجسيمة والمنتظمة والعشوائية وبين Precision وAccuracy.', s: 'لا قياس بلا خطأ. المساح الجيد يعرف نوع الخطأ وكيف يكتشفه.', d: 'الخطأ الجسيم (Blunder): غلطة كبيرة مثل قراءة 1.254 كـ 1.245 تُكتشف بالفحص المستقل. الخطأ المنتظم (Systematic): له اتجاه ثابت مثل ثابت منشور خاطئ ويُصحح بالمعايرة. الخطأ العشوائي (Random): صغير ويتوزع بالتساوي ويقل بتكرار القياس.\nالدقة النسبية (Precision) تقارب القياسات المتكررة. الصحة (Accuracy) قربها من الحقيقة. قد تكون دقيقًا وغير صحيح.\nالانحراف المعياري s = √(Σv² / (n−1)).', terms: [T1('Blunder', 'خطأ جسيم'), T1('Systematic error', 'خطأ منتظم'), T1('Random error', 'خطأ عشوائي'), T1('Residual', 'باقي')], ex: 'قراءات: 25.412، 25.415، 25.410. المتوسط 25.4123. البواقي: −0.0003، +0.0027، −0.0023.', app: 'أدخل هذه القراءات في «محلل أخطاء المساحة» وراجع s والبواقي.', tool: null, tr: ['ما نوع الخطأ إذا كان الجهاز يقرأ دائمًا أكثر بـ 3 مم؟', 'خطأ منتظم (Systematic).'], rv: ['Blunder يُكتشف بفحص مستقل.', 'تكرار القياس يقلل العشوائي لا المنتظم.'], q: [['الخطأ الذي يقل بتكرار القياس:', ['منتظم', 'عشوائي', 'جسيم'], 1, ''], ['Precision تعني:', ['قرب من الحقيقة', 'تقارب القياسات', 'سرعة'], 1, ''], ['قراءة رقمين مقلوبين مثال على:', ['منتظم', 'Blunder', 'عشوائي'], 1, '']] });

  /* ---------- s3 ---------- */
  Ls('s3', 's3-1', 2, 'الرفع المساحي: التخطيط والتنفيذ', { kw: 'detail survey topographic planning control', g: 'أن تخطط رفعًا مساحيًا من التحكم إلى التفاصيل.', s: 'الرفع الجيد يبدأ بنقاط تحكم موثوقة ثم يرصد التفاصيل منها ويُراجع قبل مغادرة الموقع.', d: 'الخطوات: استطلاع الموقع، اختيار نقاط التحكم (Control) بحيث ترى بعضها وتغطي المنطقة، قياسها بدقة أعلى من التفاصيل، ثم رفع التفاصيل (Detail Survey) بكود لكل نقطة (مبنى، سور، أرض طبيعية...).\nعدد النقاط يتبع المقياس والتضاريس: الأرض المنبسطة شبكة أوسع، والمتغيرة تحتاج نقاطًا عند كل تغير ميل.\nقبل المغادرة: راجع دفتر الحقل، افحص التكرار والمناسيب الشاذة، وأعد رصد نقطة تحكم للتحقق.', terms: [T1('Control point', 'نقطة تحكم'), T1('Detail survey', 'رفع تفاصيل'), T1('Code', 'كود')], ex: 'موقع 2 هكتار: 4 نقاط تحكم ثم 150–300 نقطة تفاصيل حسب التعقيد.', app: 'سجّل 12 نقطة في «دفتر الحقل» بأكواد ثم نفّذ فحص الجودة.', tool: null, tr: ['لماذا نعيد رصد نقطة تحكم قبل المغادرة؟', 'للتأكد أن الجهاز لم يتحرك وأن التوجيه ظل صحيحًا (Check shot).'], rv: ['تحكم ثم تفاصيل.', 'كود لكل نقطة.', 'راجع قبل المغادرة.'], q: [['نقاط التحكم تقاس بدقة:', ['أقل', 'أعلى من التفاصيل', 'لا تقاس'], 1, ''], ['فائدة الكود:', ['تزيين', 'تصنيف النقاط عند الرسم', 'تقليل الدقة'], 1, ''], ['Check shot يفيد في:', ['اكتشاف تحرك الجهاز أو خطأ التوجيه', 'رسم الخريطة', 'تحويل الوحدات'], 0, '']] });
  Ls('s3', 's3-2', 2, 'التوقيع في الموقع وقراءة الرسومات', { kw: 'setting out stakeout drawings reading', g: 'أن تقرأ رسومًا هندسية وتحدد بيانات التوقيع منها.', s: 'قبل التوقيع اقرأ اللوحة جيدًا: المقياس، الأبعاد، المناسيب، الإصدار (Revision).', d: 'تأكد أنك تعمل على آخر إصدار معتمد. حدّد المحاور (Grid lines) والأبعاد بين المحاور والمناسيب والملاحظات. التزم بالأبعاد المكتوبة لا بالقياس من الرسم بالمسطرة.\nحوّل الأبعاد إلى إحداثيات توقيع أو مسافات من خط أساس. وقّع ثم افحص أقطار المستطيل (Diagonals) وتعامد الأضلاع. سجّل أي اختلاف بين الرسم والموقع وأبلغ عنه قبل الاستمرار.', terms: [T1('Revision', 'إصدار اللوحة'), T1('Grid lines', 'خطوط المحاور'), T1('Diagonal check', 'فحص الأقطار')], ex: 'مستطيل 12×8 م: القطر المتوقع √(144+64)=14.422 م. إذا قيس 14.43 فالفرق 8 مم يُقارن بالسماحية.', app: 'استخدم «توقيع المحاور» و«فحص التعامد» في التطبيق.', tool: 'axis-setout', tr: ['مستطيل 20×15 م. ما طول القطر؟', '√(400+225)=25.000 م'], rv: ['آخر إصدار.', 'الأبعاد المكتوبة هي المعتمدة.', 'افحص الأقطار.'], q: [['قبل التوقيع تتأكد من:', ['لون الورق', 'الإصدار المعتمد', 'اسم الرسام'], 1, ''], ['قطر مستطيل 3×4 م:', ['5', '7', '12'], 0, ''], ['عند اختلاف الرسم عن الموقع:', ['تتجاهله', 'تبلغ قبل المتابعة', 'تغير الرسم'], 1, '']] });
  Ls('s3', 's3-3', 2, 'As-Built والبناء والبنية التحتية', { kw: 'as-built construction infrastructure', g: 'أن تفهم هدف رفع As-Built وكيف يُقارن بالتصميم.', s: 'As-Built هو رفع ما نُفذ فعلًا بعد التنفيذ لمقارنته بالتصميم وتسليمه كسجل.', d: 'خذ نقاط العناصر المنفذة (أركان، مناسيب أنابيب، مناهل) وقارنها بإحداثيات ومناسيب التصميم: dE وdN وdZ والمسافة. إذا كانت الفروق أكبر من السماحية تُسجل ملاحظة ويقرر المهندس التصحيح.\nفي البنية التحتية (مياه، صرف، كهرباء) تُسجل مناسيب القاع (Invert level) ومواقع المناهل لأن الدفن يخفيها بعد الردم؛ لذلك الرفع قبل الردم.', terms: [T1('As-built', 'كما نُفذ'), T1('Invert level', 'منسوب قاع الماسورة'), T1('Manhole', 'منهل')], ex: 'تصميم: E=1000.000 ، N=2000.000. منفذ: 1000.012 ، 1999.995. الفرق 12 مم و5 مم → المسافة 13 مم.', app: 'جرّب أداة «As-Built» بنقاط التصميم والمنفذ.', tool: 'asbuilt', tr: ['لماذا يُرفع قاع الماسورة قبل الردم؟', 'لأنها تخفى بعده وقد يتعذر قياسها.'], rv: ['As-Built = ما نُفذ فعلًا.', 'قارن بالتصميم واكتب الفروق.', 'ارفع قبل الردم.'], q: [['As-Built يقارن بـ:', ['التصميم', 'الطقس', 'الأسعار'], 0, ''], ['ميزة الرفع قبل الردم:', ['أسرع', 'العناصر تظل مرئية', 'لا فرق'], 1, ''], ['Invert level هو:', ['منسوب أعلى الماسورة', 'منسوب قاع الماسورة', 'قطرها'], 1, '']] });
  Ls('s3', 's3-4', 2, 'حساب الكميات وإعداد التقارير المساحية', { kw: 'quantities report', g: 'أن تحسب كمية بسيطة وتكتب تقريرًا مساحيًا منظمًا.', s: 'الكمية = مساحة × سمك أو متوسط مساحتين × المسافة. والتقرير يجب أن يقول ماذا قيس وكيف وبأي دقة.', d: 'متوسط المساحتين: V = (A1+A2)/2 × d. للحجم من شبكة نقاط يمكن استخدام الشبكة المنتظمة (Grid).\nمحتوى التقرير: بيانات المشروع، النظام المرجعي، الأجهزة وتاريخ المعايرة، طريقة العمل، النتائج بجداول ووحدات، فحوص الجودة (خطأ الإغلاق)، الملاحظات والقيود، ثم الملخص. لا تكتب رقمًا بلا وحدة أو بلا مصدر.', terms: [T1('Average end area', 'متوسط المساحتين'), T1('Report', 'تقرير'), T1('Quality check', 'فحص جودة')], ex: 'A1=12 م²، A2=18 م²، d=20 م → V=(12+18)/2×20=300 م³.', app: 'احسب الحجم بأداة «الكميات بالمقاطع» ثم أنشئ تقريرًا في «التقارير».', tool: 'vol-sections', tr: ['A1=10، A2=14، A3=20 على فواصل 25 م. احسب الحجم الكلي.', '(10+14)/2×25 + (14+20)/2×25 = 300 + 425 = 725 م³'], rv: ['V = (A1+A2)/2 × d.', 'التقرير: ماذا ومتى وكيف وبأي دقة.'], q: [['V بين A1 وA2:', ['A1×A2×d', '(A1+A2)/2×d', 'A1/A2'], 1, ''], ['التقرير الجيد يذكر:', ['النظام والوحدات والدقة', 'الألوان فقط', 'لا شيء'], 0, ''], ['رقم بلا وحدة:', ['مقبول', 'غير مقبول', 'أفضل'], 1, '']] });

  /* ---------- leveling ---------- */
  Ls('lv', 'lv-1', 1, 'مفهوم الميزانية والجهاز وإعداده', { kw: 'level instrument staff setup bubble', g: 'أن تعرف أجزاء الميزان وكيف تضبطه وتقرأ القامة.', s: 'الميزان يعطي خط نظر أفقيًا، والقامة تُقرأ عليه لنعرف فرق المنسوب بين نقطتين.', d: 'أجزاء الميزان: العدسة، الفقاعة (Bubble) الدائرية، مسامير التسوية، الحامل. نضبط الحامل تقريبًا أفقيًا ثم نسوي بالفقاعة. نقرأ القامة (Staff) بأربعة أرقام: متر، ديسيمتر، سنتيمتر، والمليمتر تقديرًا.\nأنواع الميزانية: بسيطة (وضع واحد)، مركبة (Differential) بنقاط تحويل، طولية (Profile) للمقاطع، شبكية (Grid) لحساب الأحجام.\nأفضل ممارسة: تساوي مسافة BS وFS لتقليل خطأ خط النظر (Collimation).', terms: [T1('Level', 'ميزان'), T1('Staff', 'قامة'), T1('Bubble', 'فقاعة'), T1('Collimation error', 'خطأ خط النظر')], ex: 'قراءة القامة: 1.432 م = 1 م + 4 دسم + 3 سم + 2 مم.', app: 'تدرّب على تحديد قراءات في محاكي الميزانية.', tool: 'leveling', tr: ['لماذا نساوي المسافتين BS وFS؟', 'لإلغاء أثر خطأ خط النظر الأفقي.'], rv: ['الميزان خط أفقي.', 'BS≈FS في المسافة.'], q: [['القامة تقرأ:', ['3 أرقام', '4 أرقام تقريبًا', '10 أرقام'], 1, ''], ['الميزانية المركبة تحتاج:', ['نقاط تحويل', 'GNSS', 'لا شيء'], 0, ''], ['ما يقلل خطأ خط النظر:', ['تساوي BS وFS', 'الشد', 'الألوان'], 0, '']] });
  Ls('lv', 'lv-2', 1, 'BS وIS وFS وطريقة HI', { kw: 'bs is fs hi rl height of instrument', g: 'أن تحسب RL بطريقة منسوب خط النظر HI.', s: 'HI = RL + BS. ولأي نقطة تالية: RL = HI − FS (أو RL = HI − IS).', d: 'نبدأ بنقطة معلومة المنسوب BM. نقرأ BS عليها فنحسب HI. نقرأ FS على نقطة تحويل TP فنحسب RL لها. ننقل الجهاز ونقرأ BS على نفس TP فنحسب HI جديدًا، وهكذا. القراءة الوسطية IS تُقرأ على نقاط بين BS وFS دون نقل الجهاز.\nفحص الحساب: ΣBS − ΣFS = RL(last) − RL(first).', terms: [T1('HI', 'منسوب خط النظر'), T1('BS', 'قراءة خلفية'), T1('FS', 'قراءة أمامية'), T1('IS', 'قراءة وسطية'), T1('TP', 'نقطة تحويل')], ex: 'نقطة BM:\nRL(BM) = 50.000 , BS = 1.420 → HI = 51.420\nثم FS على TP1:\nFS(TP1) = 0.860 → RL(TP1) = 50.560', app: 'حل 3 سيناريوهات في محاكي الميزانية.', tool: 'leveling', tr: ['RL(BM)=20.000، BS=1.250، IS=0.980. احسب RL للـ IS.', 'HI=21.250 ، RL = 21.250 − 0.980 = 20.270'], rv: ['HI = RL + BS.', 'RL = HI − (FS/IS).', 'ΣBS−ΣFS = ΔRL.'], q: [['HI =', ['RL − BS', 'RL + BS', 'BS − FS'], 1, ''], ['RL = HI − ؟', ['FS أو IS', 'BS', 'RL'], 0, ''], ['ΣBS−ΣFS تساوي:', ['ΔRL النهائي', 'خطأ الإغلاق', 'صفر دائمًا'], 0, 'عند عدم وجود خطأ حسابي']] });
  Ls('lv', 'lv-3', 1, 'طريقة Rise and Fall', { kw: 'rise fall', g: 'أن تحسب المناسيب بطريقة Rise & Fall وتقارنها بـ HI.', s: 'نحسب الفرق بين قراءتين متتاليتين: إذا نقصت القراءة فهناك صعود (Rise) وإن زادت فهبوط (Fall).', d: 'Rise/Fall = القراءة السابقة − القراءة الحالية. RL = RL السابق + Rise أو − Fall. الفحص: ΣBS − ΣFS = ΣRise − ΣFall = RL(last) − RL(first).\nالطريقتان تعطيان نفس النتيجة، لكن HI أسرع عند وجود IS كثيرة، وRise&Fall أسهل في اكتشاف الأخطاء الحسابية لأن لها ثلاثة فحوص.', terms: [T1('Rise', 'صعود'), T1('Fall', 'هبوط')], ex: 'قراءتان 1.500 ثم 1.200: Rise=+0.300. ثم 1.400: Fall=0.200.', app: 'قارن نتائج الطريقتين في أداة الميزانية.', tool: 'leveling', tr: ['قراءات BS=2.000 ثم FS=1.250. احسب ΔRL.', '+0.750 (Rise)'], rv: ['Rise = السابق − الحالي.', 'ثلاثة فحوص.'], q: [['إذا نقصت القراءة فهذا:', ['Rise', 'Fall', 'لا شيء'], 0, ''], ['Rise&Fall فحوصه:', ['واحد', 'ثلاثة', 'لا فحوص'], 1, ''], ['ΣRise−ΣFall =', ['ΔRL', 'ΣBS', 'صفر دائمًا'], 0, '']] });
  Ls('lv', 'lv-4', 1, 'خطأ الإغلاق وتصحيحه', { kw: 'closure misclosure adjustment loop', g: 'أن تحسب خطأ الإغلاق وتقارنه بالسماحية وتوزعه.', s: 'نغلق الدورة على نقطة معلومة؛ الفرق بين المنسوب المحسوب والمعلوم هو الخطأ.', d: 'خطأ الإغلاق = RL المحسوب − RL المعلوم. السماحية عادة C√K مم حيث K المسافة بالكيلومتر وC ثابت تحدده المواصفة (مثلًا 12 للدرجة الثالثة في بعض المواصفات، تحقق من مواصفتك). إذا كان الخطأ أقل من السماحية يُوزع التصحيح بنسبة المسافة أو عدد الأوضاع: c_i = −e × (d_i/Σd).\nإذا كان أكبر من السماحية تُعاد الميزانية للمقاطع المشتبهة.', terms: [T1('Misclosure', 'خطأ الإغلاق'), T1('Tolerance', 'السماحية'), T1('Loop', 'دورة')], ex: 'e = +6 مم، K=0.5 كم، C=12 → السماحية 8.5 مم → مقبول. التصحيح الكلي −6 مم موزعة على النقاط.', app: 'استخدم «محلل أخطاء المساحة» (دورة ميزانية) أو أداة «ضبط ميزانية LS».', tool: 'ls-level', tr: ['e=+15 مم، K=0.4، C=12. هل يقبل؟', 'السماحية 12×0.632=7.6 مم. 15 > 7.6 → مرفوض: أعد الميزانية.'], rv: ['الخطأ = المحسوب − المعلوم.', 'قارن بـ C√K.', 'لا تصحح خطأ خارج السماحية.'], q: [['الخطأ الأكبر من السماحية:', ['يُصحح', 'تُعاد الميزانية', 'يُهمل'], 1, ''], ['توزيع التصحيح يكون:', ['متساويًا دائمًا', 'بنسبة المسافة', 'عشوائيًا'], 1, ''], ['ثابت C يأتي من:', ['المواصفة', 'التخمين', 'الجهاز فقط'], 0, '']] });

  Ls('ts', 'ts-1', 2, 'أجزاء Total Station وإعداده', { kw: 'total station setup centering leveling plummet', g: 'أن تحفظ ترتيب إعداد الجهاز وتعرف أجزاءه.', s: 'التوتال ستيشن يقيس زاوية أفقية ورأسية ومسافة مائلة ويحسب الإحداثيات.', d: 'الأجزاء: القاعدة (Tribrach)، المسامير الثلاثة، الفقاعة الدائرية والإلكترونية، الشاقول الليزري، المنظار، لوحة التحكم، البطارية. الإعداد: حامل فوق العلامة، تثبيت الجهاز، تمركز بالشاقول، تسوية بالفقاعتين، إعادة فحص التمركز، ضبط الإعدادات (وحدات، ثابت منشور)، إدخال إحداثيات المحطة وارتفاع الجهاز، ثم التوجيه على نقطة معلومة.\nرتب هذه الخطوات في محاكي Total Station حتى تحفظها.', terms: [T1('Tribrach', 'قاعدة الجهاز'), T1('Plummet', 'شاقول'), T1('Prism constant', 'ثابت العاكس'), T1('Instrument height', 'ارتفاع الجهاز')], ex: 'ارتفاع الجهاز يقاس من العلامة الأرضية إلى علامة محور الدوران.', app: 'أتقن الجزء الأول من «محاكي Total Station».', tool: null, tr: ['لماذا نعيد فحص التمركز بعد التسوية؟', 'لأن التسوية قد تحرك الجهاز قليلًا عن العلامة.'], rv: ['تمركز ثم تسوية ثم إعادة تمركز.', 'سجّل ارتفاع الجهاز.'], q: [['الشاقول الليزري يفيد في:', ['التمركز', 'قياس الزاوية', 'المسافة'], 0, ''], ['بعد التسوية نفحص:', ['اللون', 'التمركز', 'البطارية فقط'], 1, ''], ['ثابت العاكس يدخل في:', ['حساب المسافة', 'حساب الزاوية', 'التسوية'], 0, '']] });
  Ls('ts', 'ts-2', 2, 'التوجيه (Backsight) والرصد وحساب الإحداثيات', { kw: 'orientation backsight observation coordinates zenith', g: 'أن تحسب إحداثيات نقطة من رصدة Hz وV وSD.', s: 'نوجّه الجهاز على نقطة معلومة ثم نرصد نقاطًا جديدة فنحسب إحداثياتها من الزاوية والمسافة.', d: 'السمت إلى BS يحسب من الإحداثيات. إذا ضُبطت قراءة الدائرة الأفقية على BS = 0 فإن سمت أي نقطة = Az(BS) + Hz. المسافة الأفقية HD = SD·sin(Z). E = E0 + HD·sin(Az) ، N = N0 + HD·cos(Az) ، Z = Z0 + SD·cos(Z) + hi − ht حيث hi ارتفاع الجهاز وht ارتفاع العاكس.\nتجاهلنا هنا انحناء الأرض والانكسار وهي مؤثرة في المسافات الطويلة.', terms: [T1('Orientation', 'توجيه'), T1('Hz', 'زاوية أفقية'), T1('Zenith', 'سمت رأسي'), T1('Target height', 'ارتفاع العاكس')], ex: 'Az(BS)=30°، Hz=100° → Az=130°. SD=50 م، Z=90° → HD=50.', app: 'حل «محاكي Total Station» الجزء الثاني.', tool: 'ts-obs', tr: ['Z=90°، SD=40.000، hi=1.50، ht=1.50، Z0=10.000. ما Z للنقطة؟', 'Z = 10 + 40·cos90° + 0 = 10.000'], rv: ['Az = Az(BS)+Hz.', 'HD = SD sin Z.', 'Z تشمل hi−ht.'], q: [['HD =', ['SD sin Z', 'SD cos Z', 'SD tan Z'], 0, ''], ['Z=90° تعني خط نظر:', ['أفقي', 'رأسي', 'مائل 45°'], 0, ''], ['ht هو:', ['ارتفاع الجهاز', 'ارتفاع العاكس', 'المسافة'], 1, '']] });
  Ls('ts', 'ts-3', 2, 'توقيع النقاط (Stakeout) بالتوتال ستيشن', { kw: 'stakeout setting out delta', g: 'أن تحسب بيانات التوقيع وتتبع الفرق حتى السماحية.', s: 'نحسب من الجهاز سمتًا ومسافة لنقطة التصميم ثم نحرك العاكس حتى ينطبق.', d: 'سمت التوقيع من المحطة إلى نقطة التصميم ومسافتها تحسبان بـ Inverse. نقيس موضع العاكس ونحسب ΔE وΔN = التصميم − المقاس ثم نحرك. يمكن توجيه الحركة بصيغة قريب/بعيد (In/Out) على خط النظر ويمين/يسار (Left/Right).\nنكرر حتى يصبح الفرق أقل من سماحية العمل (مثلًا ±10 مم لأعمال معينة؛ السماحية حسب المواصفة).', terms: [T1('Stakeout', 'توقيع'), T1('Delta', 'فرق'), T1('In/Out', 'قريب/بعيد')], ex: 'تصميم (1050.000, 2030.000) ومقاس (1050.040, 2029.980): ΔE=−0.040 ، ΔN=+0.020 → المسافة 44.7 مم.', app: 'تدرب في «محاكي التوقيع».', tool: 'ts-stake', tr: ['ΔE=+0.030، ΔN=−0.040. المسافة؟', '0.050 م'], rv: ['Δ = تصميم − مقاس.', 'كرر حتى السماحية.'], q: [['Δ =', ['مقاس − تصميم', 'تصميم − مقاس', 'مجموعهما'], 1, ''], ['السماحية تأتي من:', ['المواصفة', 'الجهاز فقط', 'التخمين'], 0, ''], ['In/Out تعني:', ['يمين/يسار', 'قريب/بعيد', 'فوق/تحت'], 1, '']] });
  Ls('ts', 'ts-4', 2, 'أخطاء الجهاز ومراجعة البيانات', { kw: 'instrument errors face left right two face', g: 'أن تعرف أخطاء التوتال ستيشن وطريقة الوجهين.', s: 'القياس بوجهين (Face Left وFace Right) يلغي عددًا من أخطاء الجهاز.', d: 'أخطاء: خط النظر (Collimation)، المحور الأفقي، الفهرس الرأسي (Index error)، التمركز، التصويب، ثابت العاكس، الظروف الجوية. القياس بالوجهين يتوسط خطأ خط النظر والمحور الأفقي والفهرس.\nمراجعة البيانات: راجع القيم الشاذة، قارن نقاط مكررة، أعد رصد نقطة معلومة، تأكد من ارتفاع العاكس المسجل لكل نقطة.', terms: [T1('Face left/right', 'وجه أيسر/أيمن'), T1('Index error', 'خطأ الفهرس'), T1('Collimation', 'خط النظر')], ex: 'قراءة Z وجه أيسر 89°59′50″ ووجه أيمن 270°00′10″ → المجموع 360°00′00″ فلا يوجد خطأ فهرس.', app: 'طبّق ذلك على بيانات في «محلل الأخطاء».', tool: null, tr: ['ما فائدة القياس بوجهين؟', 'يلغي أو يقلل أخطاء خط النظر والمحور والفهرس.'], rv: ['وجهان = أقل أخطاء.', 'راجع ht لكل نقطة.'], q: [['Z(L)+Z(R) يجب أن تساوي:', ['360°', '180°', '90°'], 0, ''], ['القياس بوجهين يلغي:', ['الأخطاء الجسيمة', 'بعض أخطاء الجهاز', 'كل الأخطاء'], 1, ''], ['نراجع:', ['ht لكل نقطة', 'لون الجهاز', 'لا شيء'], 0, '']] });

  return api;
})();
</script><script>/* Academy content part 2: GNSS, roads, construction */
(() => {
  const { Ls } = window.ACAD; const T = (e, a) => [e, a];
  Ls('gn', 'gn-1', 3, 'أساسيات GNSS وكيف يحدد الموقع', { kw: 'gnss gps constellation trilateration', g: 'أن تفهم مبدأ تحديد الموقع بالأقمار والمنظومات المختلفة.', s: 'الجهاز يقيس زمن وصول إشارات عدة أقمار فيحسب المسافة لكل قمر ثم يحل موقعه.', d: 'GNSS اسم عام لمنظومات الأقمار: GPS الأمريكية وGLONASS الروسية وGalileo الأوروبية وBeiDou الصينية. نحتاج 4 أقمار على الأقل لحل E وN وH وخطأ ساعة المستقبل. كلما زاد عدد الأقمار وتحسنت هندستها (DOP أقل) تحسنت الجودة.\nالإحداثيات الناتجة في WGS84 أو ITRF ما لم يُضبط غير ذلك، والارتفاع الناتج ارتفاع مجسمي (Ellipsoidal) وليس منسوبًا فوق سطح البحر؛ يلزم نموذج جيود (Geoid) للتحويل.', terms: [T('GNSS', 'منظومة الملاحة بالأقمار'), T('DOP', 'مؤشر هندسة الأقمار'), T('Ellipsoidal height', 'ارتفاع مجسمي'), T('Geoid', 'جيود')], ex: 'PDOP=1.5 جيد، PDOP=6 ضعيف؛ نؤجل الرصد إن كان ممكنًا.', app: 'افحص جلسة في «فحص جودة GNSS».', tool: 'gnss-qc', tr: ['لماذا نحتاج 4 أقمار لا 3؟', 'لأن المجاهيل 4: ثلاث إحداثيات + خطأ ساعة المستقبل.'], rv: ['4 أقمار كحد أدنى.', 'DOP أقل = أفضل.', 'الارتفاع مجسمي.'], q: [['الحد الأدنى للأقمار:', ['3', '4', '8'], 1, ''], ['أفضل PDOP:', ['1.5', '6', '12'], 0, ''], ['الارتفاع الناتج مباشرة:', ['منسوب MSL', 'مجسمي', 'لا يوجد'], 1, '']] });

  L('qgis', 'qg-8', 2, 'الرقمنة والتحرير والتحقق من الهندسة', 'أن ترسم عناصر جديدة بدقة وتتحقق من صلاحيتها.', 'الرقمنة هي رسم العناصر على خلفية، وتتطلب Snapping لتتصل العناصر.', 'ابدأ Toggle Editing ثم Add Polygon Feature. فعّل Snapping (Project > Snapping Options) وTopological Editing كي تشترك المضلعات المتجاورة في الحدود. بعد الانتهاء استخدم Check Validity لكشف التقاطع الذاتي والثقوب، وأداة Fix Geometries لإصلاحها. احفظ التعديلات (Save Layer Edits) قبل إغلاق التحرير.', [T('Snapping', 'التقاط'), T('Topological Editing', 'تحرير طوبولوجي'), T('Check Validity', 'فحص الصلاحية')], 'Two adjacent plots share one boundary line\nSnapping tolerance e.g. 10 pixels (check your setting)', 'ارسم قطعتين متجاورتين بـ Snapping وافحصهما بـ Check Validity.', ['ما فائدة Topological Editing؟', 'جعل الحدود المشتركة تتحرك معًا دون فجوات.'], ['فعّل Snapping قبل الرسم.', 'Check Validity قبل التسليم.'], [['Snapping يساعد على:', ['اتصال العناصر دون فجوات', 'تغيير CRS', 'الطباعة'], 0, ''], ['Check Validity يكشف:', ['التقاط ذاتي وأخطاء هندسية', 'الألوان', 'الطابعة'], 0, ''], ['قبل إغلاق التحرير:', ['احفظ التعديلات', 'احذف الطبقة', 'غيّر الاسم'], 0, '']]);
  L('qgis', 'qg-9', 2, 'تحويل الإحداثيات: Reproject وفهم EPSG', 'أن تحوّل طبقة من CRS إلى آخر بوعي.', 'تغيير CRS للمشروع لا يغير بيانات الطبقة، أما Reproject فينتج نسخة جديدة بإحداثيات الـ CRS الهدف.', 'الـ CRS الجغرافي (مثل EPSG:4326) وحداته درجات، والمسقط (مثل UTM) وحداته أمتار. للقياسات استخدم CRS مسقطًا مناسبًا للمنطقة. مصر تقع في نطاقات UTM من 35 إلى 37 شمالًا. لتحويل طبقة استخدم Vector > Data Management Tools > Reproject Layer. لا تفترض CRS لملف بلا معلومات؛ اسأل مصدر البيانات. وراجع في منتقي CRS داخل البرنامج وصف الـ CRS قبل اختياره.', [T('EPSG', 'رمز مرجعي للـ CRS'), T('Reproject', 'إعادة إسقاط'), T('Projected CRS', 'نظام مسقط')], 'EPSG:4326 units = degrees\nUTM zone CRS units = meters\nEgypt lies in UTM zones 35 to 37 N', 'حوّل طبقة من EPSG:4326 إلى UTM المناسب لمنطقتك ثم قِس مسافة معروفة.', ['ما الفرق بين تغيير CRS المشروع وReproject؟', 'الأول للعرض فقط والثاني ينتج بيانات جديدة.'], ['لا تخمّن CRS.', 'استخدم CRS مسقطًا للقياس.'], [['وحدات EPSG:4326:', ['درجات', 'أمتار', 'أقدام'], 0, ''], ['Reproject Layer:', ['ينتج طبقة جديدة بالـ CRS الهدف', 'يغير العرض فقط', 'يحذف الطبقة'], 0, ''], ['ملف بلا CRS معروف:', ['اسأل مصدره ولا تخمّن', 'اختر أي CRS', 'تجاهله'], 0, '']]);
  L('qgis', 'qg-10', 2, 'Raster Calculator وNDVI وإعادة التصنيف', 'أن تحسب مؤشرًا من نطاقين وتصنفه.', 'مؤشر NDVI يقيس خضرة النبات من نطاقي الأحمر وتحت الأحمر القريب.', 'الصيغة: NDVI = (NIR − Red) / (NIR + Red) وتنحصر قيمته بين −1 و+1. في Raster Calculator اكتب الصيغة مع أسماء النطاقات الصحيحة للقمر الذي تستخدمه، وتأكد أن النطاقين على نفس الدقة والمدى. بعدها استخدم Reclassify by Table لتقسيم النتيجة إلى فئات. حدود الفئات تحددها أنت من دراسة منطقتك، وليست قيمًا ثابتة صحيحة دائمًا.', [T('NDVI', 'مؤشر الغطاء النباتي'), T('Raster Calculator', 'حاسبة الراستر'), T('Reclassify', 'إعادة تصنيف')], 'NIR = 0.50 , Red = 0.10\nNDVI = (0.50 - 0.10) / (0.50 + 0.10) = 0.40 / 0.60 = 0.667', 'احسب NDVI من نطاقين Sentinel-2 أو Landsat (راجع أرقام النطاقات في وثائق المنتج) ثم صنفه.', ['ما مدى NDVI؟', 'من −1 إلى +1.'], ['تحقق من أرقام النطاقات.', 'حدود التصنيف من دراستك.'], [['NDVI عند NIR=0.5 وRed=0.1:', ['0.667', '0.4', '5'], 0, ''], ['مدى NDVI:', ['−1 إلى +1', '0 إلى 255', '0 إلى 100'], 0, ''], ['حدود فئات التصنيف:', ['تحددها من دراسة منطقتك', 'ثابتة عالميًا دائمًا', 'لا تهم'], 0, '']]);
  L('qgis', 'qg-11', 2, 'تصميم الخريطة النهائية: Print Layout', 'أن تخرج خريطة بمقياس رسم وعناصر خريطة كاملة.', 'الـ Layout صفحة تجمع الخريطة ومقياس الرسم وسهم الشمال والمفتاح والعنوان.', 'من Project > New Print Layout أضف Map ثم Scale Bar وNorth Arrow وLegend وTitle. اضبط مقياس الخريطة رقميًا (مثل 1:5000). صدّر PDF أو صورة بدقة مناسبة (300 dpi للطباعة). اذكر في الخريطة المصدر والتاريخ والـ CRS. الألوان والرموز يجب أن تكون مقروءة بالأبيض والأسود إن ستطبع هكذا.', [T('Layout', 'تخطيط الطباعة'), T('Scale Bar', 'مقياس رسم خطي'), T('Legend', 'مفتاح الخريطة')], 'Map scale 1:5000 -> 1 cm on paper = 50 m on ground\nA4 width 297 mm -> about 1485 m on ground (full width)', 'أخرج خريطة A4 بمقياس 1:5000 وتحقق من طول Scale Bar بمسطرة.', ['كم متر يمثل 1 سم عند 1:5000؟', '50 م.'], ['مقياس رقمي واضح.', 'اذكر المصدر والـ CRS.'], [['1 سم عند 1:5000 يمثل:', ['50 م', '5 م', '500 م'], 0, ''], ['دقة التصدير للطباعة غالبًا:', ['300 dpi', '10 dpi', '1 dpi'], 0, ''], ['يجب أن تذكر الخريطة:', ['المصدر والتاريخ والـ CRS', 'اسم الجهاز', 'لا شيء'], 0, '']]);

</script><script>/* v3 module D: Surveying Academy engine (courses, lessons, exams, certificates, progress) */

  const LV = ['Level 0: مبتدئ تمامًا|Level 0: Absolute beginner', 'Level 1: أساسيات المساحة|Level 1: Surveying basics', 'Level 2: مهارات المساح الميداني|Level 2: Field surveyor skills', 'Level 3: مهندس مساحة|Level 3: Survey engineer', 'Level 4: مهندس متقدم|Level 4: Advanced engineer', 'Level 5: تخصصات احترافية|Level 5: Professional specialisations'];
  const customCourse = () => { const ls = ((S().custom && S().custom.lessons) || []).filter((l) => l.status === 'published'); return ls.length ? { id: 'custom', lvl: 0, cat: 'custom', ic: '✍', t: 'دروسي (أضافها المسؤول)', en: 'My lessons (admin-added)', desc: 'دروس أضفتها من لوحة الإدارة المحلية', dur: 0, goals: [], project: '', yt: [], tools: [], les: ls.map((l) => l.id) } : null; };
  const allCourses = () => { const c = customCourse(); return c ? [...A.courses, c] : A.courses; };
  const lessonById = (id) => A.lessons.find((l) => l.id === id) || (((S().custom && S().custom.lessons) || []).filter((l) => l.id === id).map((l) => ({ id: l.id, course: 'custom', lvl: 0, t: l.t, goal: l.goal, simple: l.simple, detail: l.detail, terms: [], ex: l.ex, app: l.app, tr: l.app ? [l.app, ''] : null, rv: l.review ? [l.review] : [], quiz: l.quiz.map((q) => ({ q: q.q, o: q.o, a: q.a })), img: l.img }))[0]);
  const cLessons = (c) => c.les.map(lessonById).filter(Boolean);
  const cprog = (c) => { const p = prog(), n = c.les.length; return [c.les.filter((id) => p.done[id]).length, n]; };
  const courseDone = (c) => { const p = prog(), [d, n] = cprog(c), ex = S().aexam[c.id]; return d === n && n > 0 && ex && ex.best >= 70 && S().aproj[c.id] && S().aproj[c.id].done; };
  const TOK = "[A-Za-z0-9ΣΔ√(₀-₉][A-Za-z0-9ΣΔ√()._²³°′″₀-₉+\\[\\],']*";
  const FXRE = new RegExp("[−\\-+]?" + TOK + "(?:\\s*[=+−\\-×·/<>^≈≤≥→,]\\s*[−\\-+]?" + TOK + ")+", 'g');
  const CODE = /^\s*(var |const |import |from |print\(|pts=|A=|P=|d=|df=|df\[|gdf|pd\.|np\.|Transformer|Map\.|Export\.|function |=[A-Z]|[a-z]+\.[A-Za-z]+\()/;
  const fx = (x) => { let o = '', i = 0, m; FXRE.lastIndex = 0; while ((m = FXRE.exec(x))) { let t = m[0].replace(/[.,]+$/, ''); while (t.endsWith(')') && (t.match(/\)/g) || []).length > (t.match(/\(/g) || []).length) t = t.slice(0, -1); o += esc(x.slice(i, m.index)) + `<bdi dir="ltr" class="fx">${esc(t)}</bdi>`; i = m.index + t.length; FXRE.lastIndex = i; } return o + esc(x.slice(i)); };
  const para = (s, eqLtr) => String(s || '').split(/\n+/).map((x) => CODE.test(x) ? `<pre dir="ltr" style="text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto">${esc(x)}</pre>` : (/[\u0600-\u06FF]/.test(x) && !(eqLtr && /[=→]/.test(x)) ? `<p>${fx(x)}</p>` : `<p dir="ltr" style="text-align:right">${esc(x)}</p>`)).join('');
  window.GSV3d = { cprog, courseDone };

  views.academy = (a, q) => {
    setTitle(T('الأكاديمية الهندسية', 'Surveying Academy'));
    const s = S(), p = prog(), cs = allCourses();

<div class="row">${last ? `<a class="btn pri" href="#/alesson/${last.id}">▶ ${T('تابع: ', 'Resume: ')}${esc(last.t)}</a>` : ''}${(() => { const nx = A.lessons.find((l) => !p.done[l.id]); return nx ? `<a class="btn" href="#/alesson/${nx.id}">➜ ${T('الدرس المقترح التالي', 'Suggested next lesson')}</a>` : ''; })()}<a class="btn" href="#/quizbank">🧠 ${T('بنك الأسئلة / تقييم المستوى', 'Quiz bank / level check')}</a><a class="btn" href="#/courses">🎬 ${T('مسارات سريعة + يوتيوب', 'Quick paths + YouTube')}</a></div>
<div class="row" style="margin-top:10px"><input id="aq" style="flex:1;min-width:180px" placeholder="${T('ابحث في الكورسات والدروس', 'Search courses & lessons')}"><select id="ac" style="width:auto"><option value="">${T('كل التخصصات', 'All categories')}</option><option value="survey">${T('المساحة', 'Surveying')}</option><option value="software">${T('البرامج الهندسية', 'Software')}</option></select><select id="al" style="width:auto"><option value="">${T('كل المستويات', 'All levels')}</option>${LV.map((l, i) => `<option value="${i}">${esc(L(l))}</option>`).join('')}</select></div></div><div id="ar"></div>
${fav.length ? `<div class="card"><h3>⭐ ${T('المفضلة', 'Favorites')}</h3>${fav.map((id) => `<div><a href="#/alesson/${id}">${esc(lessonById(id).t)}</a></div>`).join('')}</div>` : ''}
${s.ahist.length ? `<div class="card"><h3>🕘 ${T('سجل الدروس', 'Lesson history')}</h3>${s.ahist.slice(0, 8).map((h) => (lessonById(h.id) ? `<div class="row"><a class="sp" href="#/alesson/${h.id}">${esc(lessonById(h.id).t)}</a><span class="note">${new Date(h.ts).toLocaleDateString()}</span></div>` : '')).join('')}</div>` : ''}`;
    const fill = () => {
      const qq = $('#aq').value.trim().toLowerCase(), cat = $('#ac').value, lv = $('#al').value;
      const list = cs.filter((c) => (!cat || c.cat === cat) && (lv === '' || c.lvl === +lv) && (!qq || (c.t + ' ' + c.en + ' ' + c.desc + ' ' + cLessons(c).map((l) => l.t + ' ' + (l.kw || '')).join(' ')).toLowerCase().includes(qq)));
      const byLv = [0, 1, 2, 3, 4, 5].map((i) => [i, list.filter((c) => c.lvl === i)]).filter((x) => x[1].length);
      $('#ar').innerHTML = byLv.map(([i, arr]) => `<h3>${esc(L(LV[i]))}</h3><div class="grid g2">${arr.map((c) => { const [d, n] = cprog(c); return `<a class="tool" href="#/acourse/${c.id}"><span class="ic">${c.ic}</span><b>${esc(c.t)}</b><small>${esc(c.desc)}</small><div class="bar" style="margin:8px 0"><i style="width:${n ? Math.round((d / n) * 100) : 0}%"></i></div><small>${n} ${T('دروس', 'lessons')} · ~${c.dur || '–'} ${T('ساعة', 'h')} · ${d}/${n}${courseDone(c) ? ' · 🏅' : ''}</small></a>`; }).join('')}</div>`).join('') || `<p class="note">${T('لا نتائج.', 'No results.')}</p>`;
    };
    $('#aq').oninput = fill; $('#ac').onchange = fill; $('#al').onchange = fill; fill();

  views.acourse = (id) => {

    main().innerHTML = `<div class="card"><h2>${c.ic} ${esc(c.t)}</h2><p class="note">${esc(c.en)} · ${esc(L(LV[c.lvl]))} · ${n} ${T('دروس', 'lessons')} · ~${c.dur || '–'} ${T('ساعة (تقدير)', 'h (estimate)')}</p><p>${esc(c.desc)}</p><div class="bar"><i style="width:${n ? Math.round((d / n) * 100) : 0}%"></i></div><p class="note">${d}/${n} ${T('دروس مكتملة', 'lessons completed')}</p>${c.goals && c.goals.length ? `<h4>${T('الأهداف التعليمية', 'Learning objectives')}</h4><ul>${c.goals.map((g) => `<li>${esc(g)}</li>`).join('')}</ul>` : ''}</div>
<div class="card"><h3>📘 ${T('المحتوى', 'Content')}</h3>${ls.map((l, i) => `<div class="row" style="padding:7px 0;border-bottom:1px solid var(--line)"><b>${i + 1}</b><a class="sp" href="#/alesson/${l.id}">${esc(l.t)}</a>${s.fav.lessons[l.id] ? '⭐' : ''}${p.done[l.id] ? `<span class="pill ok">✔ ${p.done[l.id].score ?? ''}%</span>` : ''}</div>`).join('')}</div>
${c.id === 'custom' ? '' : `<div class="card"><h3>🧪 ${T('اختبار الكورس', 'Course exam')}</h3><p class="note">${T('10 أسئلة عشوائية من أسئلة دروس الكورس. النجاح 70%. يمكن إعادته.', '10 random questions from the course lessons. Pass mark 70%. Retakes allowed.')}</p>${ex ? `<p>${T('أفضل نتيجة', 'Best score')}: <b>${ex.best}%</b> · ${ex.tries} ${T('محاولات', 'tries')}</p>` : ''}<a class="btn pri" href="#/aexam/${c.id}">${T('ابدأ الاختبار', 'Start exam')}</a></div>
<div class="card"><h3>🏗 ${T('مشروع نهاية الكورس', 'Final project')}</h3><p>${esc(c.project || '')}</p><label class="opt"><input type="checkbox" id="pj" ${pj.done ? 'checked' : ''}> ${T('أنجزت المشروع', 'I completed the project')}</label><textarea id="pjn" rows="2" style="width:100%" placeholder="${T('ملاحظاتك عن المشروع', 'Your project notes')}">${esc(pj.notes || '')}</textarea></div>
<div class="card"><h3>🏅 ${T('شهادة إتمام داخل التطبيق', 'In-app completion certificate')}</h3>${courseDone(c) ? `<a class="btn pri" href="#/cert/${c.id}">${T('عرض الشهادة', 'View certificate')}</a>` : `<p class="note">${T('المتطلبات: إكمال كل الدروس + اجتياز الاختبار (70%+) + تأكيد المشروع.', 'Requirements: all lessons + pass the exam (70%+) + project confirmed.')}</p>`}</div>`}
${(c.tools || []).length ? `<div class="card"><h3>🛠 ${T('أدوات تدريبية', 'Practice tools')}</h3><div class="grid g3">${c.tools.map((id) => TOOLS.tools.find((t) => t.id === id)).filter(Boolean).map(toolCard).join('')}</div></div>` : ''}
${vids.length ? `<div class="card"><h3>▶ YouTube</h3>${vids.map((y) => `<div class="row" style="padding:5px 0"><span class="pill">${y.lang === 'ar' ? 'عربي' : 'EN'}</span><a class="sp" href="${esc(y.url)}" target="_blank" rel="noopener noreferrer">${esc(y.t)}</a></div>`).join('')}<p class="note">${T('روابط من نتائج بحث يوتيوب، لم تُراجَع بالكامل. تحتاج إنترنت.', 'Links from YouTube search results, not fully reviewed. Internet required.')}</p></div>` : ''}`;
    const pjc = $('#pj'); if (pjc) { pjc.onchange = () => { s.aproj[c.id] = { done: pjc.checked, notes: $('#pjn').value }; ctx.save(); if (pjc.checked && ctx.log) ctx.log(T('مشروع كورس: ', 'Course project: ') + c.t); }; $('#pjn').oninput = () => { s.aproj[c.id] = { done: $('#pj').checked, notes: $('#pjn').value }; ctx.save(); }; }
  };

  const quizHTML = (qs, pre) => qs.map((q, i) => `<div style="margin:10px 0"><b>${i + 1}. ${esc(q.q)}</b>${q.o.map((o, j) => `<label class="opt" data-q="${i}" data-o="${j}"><input type="radio" name="${pre}${i}" value="${j}">${esc(o)}</label>`).join('')}<div class="note" id="${pre}ex${i}"></div></div>`).join('');
  const gradeQuiz = (qs, pre) => { let ok = 0; qs.forEach((q, i) => { const sel = main().querySelector(`input[name=${pre}${i}]:checked`); main().querySelectorAll(`[data-q="${i}"]`).forEach((e) => e.classList.remove('right', 'wrong')); if (sel && +sel.value === q.a) { ok++; sel.parentElement.classList.add('right'); } else { if (sel) sel.parentElement.classList.add('wrong'); main().querySelector(`[data-q="${i}"][data-o="${q.a}"]`).classList.add('right'); if (q.ex) $(`#${pre}ex${i}`).textContent = '💡 ' + q.ex; } }); return ok; };

  views.alesson = (id) => {
    const l = lessonById(id); if (!l) return (location.hash = '#/academy');
    const s = S(), p = prog(), c = allCourses().find((x) => x.id === l.course) || { les: [l.id], t: '' };
    s.alast = { lesson: l.id, course: l.course }; s.ahist = s.ahist.filter((h) => h.id !== l.id); s.ahist.unshift({ id: l.id, ts: Date.now() }); s.ahist = s.ahist.slice(0, 40); ctx.save();
    setTitle(l.t); const idx = c.les.indexOf(l.id), prev = c.les[idx - 1], next = c.les[idx + 1];
    const sec = (ic, h, body) => (body ? `<h3>${ic} ${h}</h3>${body}` : '');
    main().innerHTML = `<div class="card lesson"><div class="row"><a class="pill" href="#/acourse/${c.id}">${esc(c.t)}</a><span class="pill">${esc(L(LV[l.lvl] || LV[0]).split(':')[0])}</span><span class="sp"></span><button class="btn sm" id="fv">${s.fav.lessons[l.id] ? '⭐' : '☆'} ${T('مفضلة', 'Favorite')}</button></div><h2>${esc(l.t)}</h2>
${sec('🎯', T('هدف الدرس', 'Lesson goal'), para(l.goal))}${l.img ? `<img src="${l.img}" style="max-width:100%;border-radius:10px">` : ''}${sec('💡', T('شرح مبسط', 'Simple explanation'), para(l.simple))}${sec('📖', T('شرح تفصيلي', 'Detailed explanation'), para(l.detail))}
${l.terms && l.terms.length ? `<h3>🔤 ${T('مصطلحات', 'Terms')}</h3><div class="tw"><table><tbody>${l.terms.map(([e, a]) => `<tr><td style="direction:ltr">${esc(e)}</td><td style="direction:rtl;text-align:right;white-space:normal">${esc(a)}</td></tr>`).join('')}</tbody></table></div>` : ''}
${sec('🧮', T('مثال محلول', 'Worked example'), para(l.ex, true))}${sec('🛠', T('تطبيق عملي', 'Practical application'), para(l.app) + (l.tool ? `<p><a class="btn" href="#/tool/${l.tool}">${T('افتح الأداة', 'Open the tool')}</a></p>` : ''))}
${l.tr && l.tr[0] ? `<h3>✍ ${T('تمرين', 'Exercise')}</h3>${para(l.tr[0])}${l.tr[1] ? `<details><summary>${T('الإجابة', 'Answer')}</summary>${para(l.tr[1])}</details>` : ''}` : ''}
${l.rv && l.rv.length ? `<h3>🔁 ${T('مراجعة', 'Review')}</h3><ul>${l.rv.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>` : ''}
${l.quiz && l.quiz.length ? `<h3>📝 ${T('اختبار قصير', 'Short quiz')}</h3><div id="qz">${quizHTML(l.quiz, 'q')}</div><div class="row"><button class="btn pri" id="chk">${T('تحقق', 'Check')}</button><span id="qr" class="note"></span></div><p class="note">${T('تُحتسب الدرس مكتملًا عند 70% أو أكثر. يمكنك إعادة المحاولة.', 'The lesson counts as completed at 70% or more. You can retry.')}</p>` : ''}
<div class="row" style="margin-top:14px">${prev ? `<a class="btn" href="#/alesson/${prev}">⬅ ${T('السابق', 'Previous')}</a>` : ''}<span class="sp"></span>${next ? `<a class="btn pri" href="#/alesson/${next}">${T('التالي', 'Next')} ➜</a>` : `<a class="btn pri" href="#/acourse/${c.id}">${T('إلى الكورس', 'To the course')}</a>`}</div></div>`;
    $('#fv').onclick = () => { if (s.fav.lessons[l.id]) delete s.fav.lessons[l.id]; else s.fav.lessons[l.id] = 1; ctx.save(); $('#fv').textContent = (s.fav.lessons[l.id] ? '⭐' : '☆') + ' ' + T('مفضلة', 'Favorite'); };
    const chk = $('#chk'); if (chk) chk.onclick = () => {
      const ok = gradeQuiz(l.quiz, 'q'), sc = Math.round((ok / l.quiz.length) * 100); $('#qr').textContent = `${ok}/${l.quiz.length} = ${sc}%`;
      const prevScore = p.done[l.id] ? p.done[l.id].score : -1; if (sc >= 70) { p.done[l.id] = { ts: Date.now(), score: Math.max(sc, prevScore) }; if (prevScore < 0 && ctx.log) ctx.log(T('أكملت الدرس: ', 'Completed lesson: ') + l.t); toast(T('✔ تم إكمال الدرس', '✔ Lesson completed')); } else toast(T('أعد المحاولة بعد مراجعة الشرح', 'Review and retry'));
      ctx.save();
    };
  };

  views.aexam = (id) => {
    const c = A.courses.find((x) => x.id === id); if (!c) return (location.hash = '#/academy');
    setTitle(T('اختبار: ', 'Exam: ') + c.t);
    const pool = []; cLessons(c).forEach((l) => (l.quiz || []).forEach((q) => pool.push(q)));
    let items = pool.sort(() => Math.random() - 0.5).slice(0, 10).map((x) => { const idx = x.o.map((_, i) => i).sort(() => Math.random() - 0.5); return { q: x.q, ex: x.ex, o: idx.map((i) => x.o[i]), a: idx.indexOf(x.a) }; });
    main().innerHTML = `<div class="card"><h2>🧪 ${esc(c.t)}</h2><p class="note">${items.length} ${T('سؤالًا. النجاح 70%.', 'questions. Pass mark 70%.')}</p>${quizHTML(items, 'e')}<div class="row"><button class="btn pri" id="ck">${T('تسليم', 'Submit')}</button><span id="qr"></span><a class="btn" href="#/aexam/${c.id}">${T('اختبار جديد', 'New exam')}</a><a class="btn" href="#/acourse/${c.id}">⬅</a></div></div>`;
    $('#ck').onclick = () => { const ok = gradeQuiz(items, 'e'), sc = Math.round((ok / items.length) * 100); $('#qr').textContent = `${ok}/${items.length} = ${sc}% ${sc >= 70 ? '✔' : '✘'}`; const ex = S().aexam[c.id] || { best: 0, tries: 0 }; ex.tries++; ex.best = Math.max(ex.best, sc); ex.ts = Date.now(); S().aexam[c.id] = ex; ctx.save(); if (ctx.log) ctx.log(`${T('اختبار كورس', 'Course exam')} ${c.t}: ${sc}%`); $('#ck').disabled = true; };
  };

  views.cert = (id) => {
    const c = A.courses.find((x) => x.id === id); if (!c || !courseDone(c)) return (location.hash = '#/academy');
    setTitle(T('شهادة إتمام', 'Completion certificate'));
    const name = (S().user && S().user.name) || '', ex = S().aexam[c.id];
    const html = `<div style="border:6px double #0b7f86;padding:30px;text-align:center"><h1>GeoSurvey Engineer Pro</h1><h2>${T('شهادة إتمام كورس', 'Course completion certificate')}</h2><p style="font-size:22px">${name ? esc(name) : T('(اكتب اسمك من «ملفي»)', '(set your name in Profile)')}</p><p>${T('أتمّ كورس', 'completed the course')}</p><h2>${esc(c.t)}</h2><p>${T('نتيجة اختبار الكورس', 'Exam score')}: ${ex.best}% · ${new Date().toLocaleDateString()}</p><p style="font-size:12px;color:#555">${T('شهادة داخل التطبيق لأغراض التحفيز والتوثيق الشخصي فقط. ليست شهادة معتمدة من جهة تعليمية أو مهنية.', 'In-app certificate for motivation and personal record only. It is not accredited by any educational or professional body.')}</p></div>`;
    main().innerHTML = `<div class="card">${html}<div class="row" style="margin-top:10px"><button class="btn pri" id="pr">🖨 ${T('طباعة / PDF', 'Print / PDF')}</button><a class="btn" href="#/acourse/${c.id}">⬅</a></div></div>`;
    $('#pr').onclick = () => ctx.printHTML(html);
  };
});
